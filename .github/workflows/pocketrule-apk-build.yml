name: PocketRule APK - Clean Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Upload PocketRule APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PocketRule
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor packages
        run: |
          npm install @capacitor/core@7.6.0
          npm install @capacitor/android@7.6.0
          npm install @capacitor/local-notifications@7.0.7
          npm install @capacitor/cli@7.6.0
          npm install lucide-react

      - name: Build PocketRule
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
                  )

          manifest.write_text(text)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully created."

      - name: Upload PocketRule APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketRule-APK-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
