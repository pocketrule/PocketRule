name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL REQUIRED CAPACITOR PACKAGES
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        run: |
          npm audit --audit-level=high || {
            echo ""
            echo "WARNING: npm audit reported high-level findings."
            echo "The build will continue so the AAB can be produced."
          }


      # ============================================================
      # 6. BUILD WEB APP
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ADD ANDROID PLATFORM ONLY IF NEEDED
      # ============================================================

      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists."
          else
            echo "Adding Android platform..."
            npx cap add android
          fi


      # ============================================================
      # 8. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android


      # ============================================================
      # 9. ADD ANDROID NOTIFICATION PERMISSION
      # ============================================================

      - name: Add Android notification permission
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          marker = "<application"

          if marker not in text:
              raise SystemExit(
                  "ERROR: <application> tag was not found."
              )

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
          ]

          missing = [
              permission
              for permission in permissions
              if permission not in text
          ]

          if missing:
              position = text.find(marker)

              text = (
                  text[:position]
                  + "\n    "
                  + "\n    ".join(missing)
                  + "\n\n    "
                  + text[position:]
              )

              manifest.write_text(text)

          print(
              "Android notification permissions configured."
          )
          PY


      # ============================================================
      # 10. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 11. SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."


      # ============================================================
      # 13. DECODE KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          test -s android/upload-keystore-original || {
            echo "ERROR: Keystore could not be decoded."
            exit 1
          }

          chmod 600 android/upload-keystore-original

          echo "Keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null 2>&1
          then
            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "Detected keystore type: PKCS12"

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null 2>&1
          then
            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "Detected keystore type: JKS"

          else
            echo "ERROR: Could not identify keystore type."
            exit 1
          fi


      # ============================================================
      # 15. VERIFY ORIGINAL KEYSTORE
      # ============================================================

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/original-keystore.txt

          if ! grep -Fq \
            "Alias name: $KEY_ALIAS" \
            /tmp/original-keystore.txt
          then
            echo "ERROR: KEY_ALIAS was not found."

            echo "Available aliases:"
            grep "Alias name:" \
              /tmp/original-keystore.txt || true

            exit 1
          fi

          echo "Original keystore and alias verified."


      # ============================================================
      # 16. VERIFY PRIVATE KEY
      # ============================================================

      - name: Verify original private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/private-key-test.csr

          rm -f /tmp/private-key-test.csr

          echo "Private key verified."


      # ============================================================
      # 17. PREPARE JKS KEYSTORE
      # ============================================================

      - name: Prepare JKS signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          rm -f android/upload-keystore.jks

          if [ "$KEYSTORE_TYPE" = "JKS" ]; then

            cp \
              android/upload-keystore-original \
              android/upload-keystore.jks

          else

            keytool \
              -importkeystore \
              -srckeystore android/upload-keystore-original \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -destkeystore android/upload-keystore.jks \
              -deststoretype JKS \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEY_PASSWORD" \
              -destalias "$KEY_ALIAS" \
              -noprompt

          fi

          test -s android/upload-keystore.jks || {
            echo "ERROR: JKS keystore was not created."
            exit 1
          }

          chmod 600 android/upload-keystore.jks

          echo "JKS signing keystore prepared."


      # ============================================================
      # 18. VERIFY JKS
      # ============================================================

      - name: Verify JKS signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -storetype JKS \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/jks-info.txt

          if ! grep -Fq \
            "Alias name: $KEY_ALIAS" \
            /tmp/jks-info.txt
          then
            echo "ERROR: Alias missing from JKS."
            exit 1
          fi

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/jks-private-key-test.csr

          rm -f /tmp/jks-private-key-test.csr

          echo "JKS and private key verified."


      # ============================================================
      # 19. CONFIGURE RELEASE SIGNING + VERSION
      # ============================================================

      - name: Configure Android release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          text = path.read_text()

          VERSION_CODE = "11708"
          VERSION_NAME = "1.17.8"

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          version_code_pattern = (
              r"\bversionCode\s+\d+"
          )

          if not re.search(
              version_code_pattern,
              text
          ):
              raise SystemExit(
                  "ERROR: versionCode was not found."
              )

          text = re.sub(
              version_code_pattern,
              f"versionCode {VERSION_CODE}",
              text
          )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          version_name_pattern = (
              r'\bversionName\s+["\'][^"\']+["\']'
          )

          if not re.search(
              version_name_pattern,
              text
          ):
              raise SystemExit(
                  "ERROR: versionName was not found."
              )

          text = re.sub(
              version_name_pattern,
              f'versionName "{VERSION_NAME}"',
              text
          )

          # --------------------------------------------------------
          # SIGNING CONFIG
          # --------------------------------------------------------

          signing_block = """
        signingConfigs {
            release {
                storeFile file("../upload-keystore.jks")
                storeType "JKS"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
          """

          signing_configs_match = re.search(
              r"signingConfigs\s*\{",
              text
          )

          if signing_configs_match:

              release_config_match = re.search(
                  r"signingConfigs\s*\{[\s\S]*?release\s*\{[\s\S]*?\}",
                  text
              )

              if not release_config_match:

                  insert_at = signing_configs_match.end()

                  release_config = """
            release {
                storeFile file("../upload-keystore.jks")
                storeType "JKS"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
                  """

                  text = (
                      text[:insert_at]
                      + release_config
                      + text[insert_at:]
                  )

          else:

              android_match = re.search(
                  r"\bandroid\s*\{",
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              insert_at = android_match.end()

              text = (
                  text[:insert_at]
                  + signing_block
                  + text[insert_at:]
              )

          # --------------------------------------------------------
          # RELEASE SIGNING
          # --------------------------------------------------------

          if (
              "signingConfig signingConfigs.release"
              not in text
          ):

              release_match = re.search(
                  r"buildTypes\s*\{\s*release\s*\{",
                  text
              )

              if not release_match:
                  raise SystemExit(
                      "ERROR: release build type not found."
                  )

              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n"
                  r"            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)

          print(
              "Android release configuration updated."
          )
          print(
              f"versionName: {VERSION_NAME}"
          )
          print(
              f"versionCode: {VERSION_CODE}"
          )
          PY


      # ============================================================
      # 20. FINAL CONFIGURATION CHECK
      # ============================================================

      - name: Verify Android configuration
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()

          # Signing
          if (
              "signingConfig signingConfigs.release"
              not in text
          ):
              raise SystemExit(
                  "ERROR: Release signing is not configured."
              )

          if (
              '../upload-keystore.jks'
              not in text
          ):
              raise SystemExit(
                  "ERROR: Upload keystore is not configured."
              )

          # Version code
          codes = re.findall(
              r"\bversionCode\s+(\d+)",
              text
          )

          if len(codes) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one versionCode. "
                  f"Found {len(codes)}."
              )

          if codes[0] != "11708":
              raise SystemExit(
                  "ERROR: versionCode must be 11708. "
                  f"Found {codes[0]}."
              )

          # Version name
          names = re.findall(
              r'\bversionName\s+["\']([^"\']+)["\']',
              text
          )

          if len(names) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one versionName. "
                  f"Found {len(names)}."
              )

          if names[0] != "1.17.8":
              raise SystemExit(
                  "ERROR: versionName must be 1.17.8. "
                  f"Found {names[0]}."
              )

          print("============================================")
          print("FINAL CONFIGURATION CHECK PASSED")
          print("============================================")
          print("Version name : 1.17.8")
          print("Version code : 11708")
          print("Signing      : CONFIGURED")
          print("============================================")
          PY


      # ============================================================
      # 21. BUILD SIGNED AAB
      # ============================================================

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.K
