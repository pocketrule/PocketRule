name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 4. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        run: |
          npm audit --audit-level=high || true
          echo "Security audit completed."


      # ============================================================
      # 5. BUILD WEB APP
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 6. ANDROID
      # ============================================================

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi


      - name: Generate Android assets
        run: |
          if [ -d "assets" ]; then
            npx -y @capacitor/assets@3.0.5 generate --android
          else
            echo "No assets directory. Skipping."
          fi


      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 7. ANDROID PERMISSIONS
      # ============================================================

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          manifest.write_text(text)

          print("Android permissions configured.")
          PY


      # ============================================================
      # 8. JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 9. SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          [ -n "$ANDROID_KEYSTORE_BASE64" ] || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          [ -n "$KEYSTORE_PASSWORD" ] || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          [ -n "$KEY_ALIAS" ] || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          [ -n "$KEY_PASSWORD" ] || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "Signing secrets are present."


      # ============================================================
      # 10. DECODE KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          test -s android/upload-keystore-original

          chmod 600 android/upload-keystore-original

          echo "Keystore decoded."


      # ============================================================
      # 11. DETECT KEYSTORE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          echo "Detecting keystore..."

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/p12.txt 2>&1
          then

            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

            echo "Keystore type: PKCS12"

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/jks.txt 2>&1
          then

            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

            echo "Keystore type: JKS"

          else

            echo "ERROR: Unable to identify keystore."

            cat /tmp/p12.txt || true
            cat /tmp/jks.txt || true

            exit 1
          fi


      # ============================================================
      # 12. VERIFY KEYSTORE
      # ============================================================

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/keystore-info.txt

          if ! grep -Fq "Alias name: $KEY_ALIAS" /tmp/keystore-info.txt; then
            echo "ERROR: Alias not found."

            grep "Alias name:" /tmp/keystore-info.txt || true

            exit 1
          fi

          echo "Keystore and alias verified."


      # ============================================================
      # 13. VERIFY PRIVATE KEY
      # ============================================================

      - name: Verify private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$EFFECTIVE_KEY_PASSWORD" \
            -file /tmp/test.csr

          rm -f /tmp/test.csr

          echo "Private key verified."


      # ============================================================
      # 14. VERSION + SIGNING CONFIGURATION
      # ============================================================

      - name: Configure Android release
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          text = path.read_text()

          VERSION_CODE = 11709
          VERSION_NAME = "1.17.9"

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          matches = re.findall(
              r"\bversionCode\s+\d+",
              text
          )

          if not matches:
              raise SystemExit(
                  "ERROR: versionCode not found."
              )

          text = re.sub(
              r"\bversionCode\s+\d+",
              f"versionCode {VERSION_CODE}",
              text
          )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          matches = re.findall(
              r'\bversionName\s+["\'][^"\']+["\']',
              text
          )

          if not matches:
              raise SystemExit(
                  "ERROR: versionName not found."
              )

          text = re.sub(
              r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "{VERSION_NAME}"',
              text
          )

          # --------------------------------------------------------
          # REMOVE EXISTING signingConfigs
          # --------------------------------------------------------

          start_match = re.search(
              r"\bsigningConfigs\s*\{",
              text
          )

          signing_block = """signingConfigs {
              release {
                  storeFile file("../upload-keystore-original")
                  storeType System.getenv("KEYSTORE_TYPE")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("EFFECTIVE_KEY_PASSWORD")
              }
          }"""

          if start_match:

              start = start_match.start()
              brace = text.find("{", start)

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "ERROR: signingConfigs block could not be parsed."
                  )

              text = (
                  text[:start]
                  + signing_block
                  + text[end:]
              )

          else:

              android_match = re.search(
                  r"\bandroid\s*\{",
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              position = android_match.end()

              block = "\n\n    " + signing_block.replace(
                  "\n",
                  "\n    "
              )

              text = (
                  text[:position]
                  + block
                  + text[position:]
              )

          # --------------------------------------------------------
          # RELEASE SIGNING
          # --------------------------------------------------------

          if "signingConfig signingConfigs.release" not in text:

              release_match = re.search(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  text
              )

              if not release_match:
                  raise SystemExit(
                      "ERROR: release build type not found."
                  )

              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)

          print("Version:", VERSION_NAME)
          print("Version code:", VERSION_CODE)
          print("Signing configured.")
          PY


      # ============================================================
      # 15. VERIFY CONFIGURATION
      # ============================================================

      - name: Verify Android configuration
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path(
              "android/app/build.gradle"
          ).read_text()

          codes = re.findall(
              r"\bversionCode\s+(\d+)",
              text
          )

          if len(codes) != 1:
              raise SystemExit(
                  f"ERROR: Expected one versionCode, found {len(codes)}."
              )

          if codes[0] != "11709":
              raise SystemExit(
                  f"ERROR: Expected versionCode 11709, found {codes[0]}."
              )

          names = re.findall(
              r'\bversionName\s+["\']([^"\']+)["\']',
              text
          )

          if len(names) != 1:
              raise SystemExit(
                  f"ERROR: Expected one versionName, found {len(names)}."
              )

          if names[0] != "1.17.9":
              raise SystemExit(
                  f"ERROR: Expected versionName 1.17.9, found {names[0]}."
              )

          if "signingConfig signingConfigs.release" not in text:
              raise SystemExit(
                  "ERROR: Release signing is not configured."
              )

          print("================================")
          print("FINAL CONFIGURATION VERIFIED")
          print("versionName: 1.17.9")
          print("versionCode: 11709")
          print("release signing: OK")
          print("================================")
          PY


      # ============================================================
      # 16. BUILD AAB
      # ============================================================

      - name: Build signed release AAB
        env:
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EFFECTIVE_KEY_PASSWORD: ${{ env.EFFECTIVE_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 17. COPY AAB TO FIXED LOCATION
      # ============================================================

      - name: Prepare AAB artifact
        run: |
          set -e

          mkdir -p release

          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Expected AAB was not found:"
            echo "$AAB_FILE"

            echo ""
            echo "Available AAB files:"
            find android -type f -name "*.aab" -print || true

            exit 1
          fi

          cp \
            "$AAB_FILE" \
            "release/PocketRule-v1.17.9-code11709.aab"

          echo "AAB prepared:"
          ls -lh release/PocketRule-v1.17.9-code11709.aab


      # ============================================================
      # 18. VERIFY AAB
      # ============================================================

      - name: Verify final AAB
        run: |
          set -e

          FILE="release/PocketRule-v1.17.9-code11709.aab"

          test -f "$FILE"
          test -s "$FILE"

          echo "================================"
          echo "AAB READY"
          echo "================================"

          ls -lh "$FILE"

          echo ""
          echo "SHA256:"
          sha256sum "$FILE"


      # ============================================================
      # 19. VERIFY SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/PocketRule-v1.17.9-code11709.aab

          echo "AAB signature verified."


      # ============================================================
      # 20. UPLOAD AAB — IMPORTANT
      # ============================================================

      - name: Upload PocketRule AAB
        uses: actions/upload-artifact@v4
        with:
          name: PocketRule-AAB-v1.17.9-code11709
          path: release/PocketRule-v1.17.9-code11709.aab
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 21. CONFIRM ARTIFACT
      # ============================================================

      - name: Confirm artifact upload source
        run: |
          echo "================================"
          echo "ARTIFACT UPLOAD COMPLETE"
          echo "================================"
          echo "PocketRule-AAB-v1.17.9-code11709"
          echo ""
          echo "File:"
          echo "PocketRule-v1.17.9-code11709.aab"
