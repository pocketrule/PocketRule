name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL CAPACITOR PACKAGES
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        continue-on-error: true
        run: |
          echo "Running npm security audit..."
          npm audit --audit-level=high || true

          echo ""
          echo "Security audit completed."
          echo "Audit findings do not block the release build."


      # ============================================================
      # 6. BUILD WEB APP
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ADD ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists."
          else
            npx cap add android
          fi


      # ============================================================
      # 8. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          if [ -d "assets" ]; then
            echo "Generating Android assets..."
            npx -y @capacitor/assets@3.0.5 generate --android
          else
            echo "No assets directory found. Skipping asset generation."
          fi


      # ============================================================
      # 9. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 10. ANDROID NOTIFICATION PERMISSIONS
      # ============================================================

      - name: Configure Android permissions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          missing = [
              p for p in permissions
              if p not in text
          ]

          if missing:
              marker = "</manifest>"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: Closing manifest tag not found."
                  )

              text = text.replace(
                  marker,
                  "\n    "
                  + "\n    ".join(missing)
                  + "\n"
                  + marker,
                  1
              )

              manifest.write_text(text)

          print("Android permissions verified.")
          PY


      # ============================================================
      # 11. SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."


      # ============================================================
      # 13. DECODE KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p android

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          if [ ! -s android/upload-keystore-original ]; then
            echo "ERROR: Keystore decoding failed."
            exit 1
          fi

          chmod 600 android/upload-keystore-original

          echo "Upload keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore type..."

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/pkcs12-test.txt 2>&1
          then
            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

            # IMPORTANT:
            # PKCS12 signing uses the store password for the key.
            echo "EFFECTIVE_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

            echo "Detected keystore type: PKCS12"
            echo "PKCS12 key password will use the store password."

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/jks-test.txt 2>&1
          then
            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"

            # JKS may have a separate key password.
            echo "EFFECTIVE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

            echo "Detected keystore type: JKS"

          else
            echo "ERROR: Could not identify the keystore type."

            echo ""
            echo "PKCS12 test:"
            cat /tmp/pkcs12-test.txt || true

            echo ""
            echo "JKS test:"
            cat /tmp/jks-test.txt || true

            exit 1
          fi


      # ============================================================
      # 15. VERIFY KEYSTORE + ALIAS
      # ============================================================

      - name: Verify upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/keystore-info.txt

          if ! grep -Fq "Alias name: $KEY_ALIAS" /tmp/keystore-info.txt; then
            echo "ERROR: KEY_ALIAS was not found."

            echo ""
            echo "Available aliases:"
            grep "Alias name:" /tmp/keystore-info.txt || true

            exit 1
          fi

          echo "Keystore verified."
          echo "Alias verified."


      # ============================================================
      # 16. VERIFY PRIVATE KEY
      # ============================================================

      - name: Verify private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Testing private key..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$EFFECTIVE_KEY_PASSWORD" \
            -file /tmp/private-key-test.csr

          rm -f /tmp/private-key-test.csr

          echo "Private key verified successfully."


      # ============================================================
      # 17. CONFIGURE VERSION + SIGNING
      # ============================================================

      - name: Configure Android release signing and version
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION_CODE = 11709
          VERSION_NAME = "1.17.9"

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          text = path.read_text()

          # ========================================================
          # VERSION CODE
          # ========================================================

          text, count = re.subn(
              r"\bversionCode\s+\d+",
              f"versionCode {VERSION_CODE}",
              text
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: versionCode was not found."
              )

          # ========================================================
          # VERSION NAME
          # ========================================================

          text, count = re.subn(
              r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "{VERSION_NAME}"',
              text
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: versionName was not found."
              )

          # ========================================================
          # REMOVE EXISTING signingConfigs BLOCK
          # ========================================================

          match = re.search(
              r"\bsigningConfigs\s*\{",
              text
          )

          new_signing_configs = """signingConfigs {
              release {
                  storeFile file("../upload-keystore-original")
                  storeType System.getenv("KEYSTORE_TYPE")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("EFFECTIVE_KEY_PASSWORD")
              }
          }"""

          if match:
              start = match.start()
              brace = text.find("{", start)

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "ERROR: Could not parse signingConfigs."
                  )

              text = (
                  text[:start]
                  + new_signing_configs
                  + text[end:]
              )

          else:
              android_match = re.search(
                  r"\bandroid\s*\{",
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block was not found."
                  )

              insert_at = android_match.end()

              block = "\n\n    " + new_signing_configs.replace(
                  "\n",
                  "\n    "
              )

              text = (
                  text[:insert_at]
                  + block
                  + text[insert_at:]
              )

          # ========================================================
          # ENSURE RELEASE USES RELEASE SIGNING
          # ========================================================

          if "signingConfig signingConfigs.release" not in text:

              release_match = re.search(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  text
              )

              if not release_match:
                  raise SystemExit(
                      "ERROR: release build type not found."
                  )

              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)

          print("======================================")
          print("POCKETRULE RELEASE CONFIGURATION")
          print("======================================")
          print("Version name :", VERSION_NAME)
          print("Version code :", VERSION_CODE)
          print("Signing      : configured")
          print("======================================")
          PY


      # ============================================================
      # 18. VERIFY FINAL CONFIGURATION
      # ============================================================

      - name: Verify final Android configuration
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION_CODE = 11709
          VERSION_NAME = "1.17.9"

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: build.gradle not found."
              )

          text = path.read_text()

          # VERSION CODE
          codes = re.findall(
              r"\bversionCode\s+(\d+)",
              text
          )

          if len(codes) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionCode. "
                  f"Found {len(codes)}."
              )

          if int(codes[0]) != VERSION_CODE:
              raise SystemExit(
                  f"ERROR: Expected versionCode {VERSION_CODE}; "
                  f"found {codes[0]}."
              )

          # VERSION NAME
          names = re.findall(
              r'\bversionName\s+["\']([^"\']+)["\']',
              text
          )

          if len(names) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionName. "
                  f"Found {len(names)}."
              )

          if names[0] != VERSION_NAME:
              raise SystemExit(
                  f"ERROR: Expected versionName {VERSION_NAME}; "
                  f"found {names[0]}."
              )

          # SIGNING
          required = [
              "signingConfigs",
              "storeFile file(\"../upload-keystore-original\")",
              "storePassword System.getenv(\"KEYSTORE_PASSWORD\")",
              "keyAlias System.getenv(\"KEY_ALIAS\")",
              "keyPassword System.getenv(\"EFFECTIVE_KEY_PASSWORD\")",
              "signingConfig signingConfigs.release"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERROR: Missing signing configuration:\n"
                      + item
                  )

          print("Android configuration verified.")
          print(f"versionName = {VERSION_NAME}")
          print(f"versionCode = {VERSION_CODE}")
          print("release signing = configured")
          print("PKCS12/JKS password handling = configured")
          PY


      # ============================================================
      # 19. BUILD SIGNED AAB
      # ============================================================

      - name: Build signed release AAB
        env:
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EFFECTIVE_KEY_PASSWORD: ${{ env.EFFECTIVE_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 20. LOCATE AAB
      #
