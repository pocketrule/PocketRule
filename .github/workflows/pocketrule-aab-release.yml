name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      # No npm cache because the repository does not currently
      # have a package-lock.json.

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL CAPACITOR PACKAGES
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      # Audit vulnerabilities are reported but do not stop the
      # production build.

      - name: Security audit
        continue-on-error: true
        run: npm audit --audit-level=high


      # ============================================================
      # 6. BUILD POCKETRULE WEB APP
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ADD ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: npx cap add android


      # ============================================================
      # 8. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android


      # ============================================================
      # 9. ADD ANDROID NOTIFICATION PERMISSION
      # ============================================================

      - name: Add Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

              if marker not in text:
                  raise SystemExit(
                      "ERROR: Could not find Android manifest root."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + permission,
                  1
              )

              manifest.write_text(text)

          print("Android notification permission configured.")
          PY


      # ============================================================
      # 10. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 11. SETUP JAVA 21
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "All four signing secrets are present."


      # ============================================================
      # 13. DECODE ORIGINAL KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/upload-keystore-original

          test -s android/upload-keystore-original || {
            echo "ERROR: Keystore decoding failed."
            exit 1
          }

          chmod 600 android/upload-keystore-original

          echo "Original keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore type..."

          if keytool \
              -list \
              -storetype PKCS12 \
              -keystore android/upload-keystore-original \
              -storepass "$KEYSTORE_PASSWORD" \
              > /tmp/pkcs12-test.txt 2>&1; then

            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "Detected keystore type: PKCS12"

          elif keytool \
              -list \
              -storetype JKS \
              -keystore android/upload-keystore-original \
              -storepass "$KEYSTORE_PASSWORD" \
              > /tmp/jks-test.txt 2>&1; then

            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "Detected keystore type: JKS"

          else
            echo "ERROR: Could not identify the keystore type."
            echo ""
            echo "PKCS12 test:"
            cat /tmp/pkcs12-test.txt || true
            echo ""
            echo "JKS test:"
            cat /tmp/jks-test.txt || true
            exit 1
          fi


      # ============================================================
      # 15. VERIFY ORIGINAL KEYSTORE + ALIAS
      # ============================================================

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Checking original keystore..."

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/original-keystore.txt

          echo "Checking requested alias..."

          if ! grep -Fq "Alias name: $KEY_ALIAS" /tmp/original-keystore.txt; then
            echo "ERROR: KEY_ALIAS was not found in the keystore."
            echo ""
            echo "Available aliases:"
            grep "Alias name:" /tmp/original-keystore.txt || true
            exit 1
          fi

          echo "Keystore and alias verified."


      # ============================================================
      # 16. VERIFY ORIGINAL PRIVATE KEY
      # ============================================================

      - name: Verify original private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Testing private key..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/private-key-test.csr

          rm -f /tmp/private-key-test.csr

          echo "Private key verified successfully."


      # ============================================================
      # 17. PREPARE JKS SIGNING KEYSTORE
      # ============================================================

      - name: Prepare JKS signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          rm -f android/upload-keystore.jks

          if [ "$KEYSTORE_TYPE" = "JKS" ]; then

            echo "Original keystore is already JKS."

            cp \
              android/upload-keystore-original \
              android/upload-keystore.jks

          else

            echo "Original keystore is PKCS12."
            echo "Converting PKCS12 to JKS..."

            keytool \
              -importkeystore \
              -srckeystore android/upload-keystore-original \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -destkeystore android/upload-keystore.jks \
              -deststoretype JKS \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEY_PASSWORD" \
              -destalias "$KEY_ALIAS" \
              -noprompt

          fi

          test -s android/upload-keystore.jks || {
            echo "ERROR: JKS keystore was not created."
            exit 1
          }

          chmod 600 android/upload-keystore.jks

          echo "JKS signing keystore prepared."


      # ============================================================
      # 18. VERIFY JKS
      # ============================================================

      - name: Verify JKS signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Verifying JKS..."

          keytool \
            -list \
            -v \
            -storetype JKS \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/jks-info.txt

          if ! grep -Fq "Alias name: $KEY_ALIAS" /tmp/jks-info.txt; then
            echo "ERROR: Alias was not found in converted JKS."
            grep "Alias name:" /tmp/jks-info.txt || true
            exit 1
          fi

          echo "Testing JKS private key..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/jks-private-key-test.csr

          rm -f /tmp/jks-private-key-test.csr

          echo "============================================"
          echo "JKS AND PRIVATE KEY VERIFIED SUCCESSFULLY"
          echo "============================================"


      # ============================================================
      # 19. CONFIGURE ANDROID RELEASE SIGNING
      # ============================================================

      - name: Configure Android release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle was not found."
              )

          text = path.read_text()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storeType "JKS"
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" in text:
              raise SystemExit(
                  "ERROR: A signingConfigs block already exists."
              )

          if "android {" not in text:
              raise SystemExit(
                  "ERROR: Could not find android {} block."
              )

          text = text.replace(
              "android {",
              "android {" + signing_config,
              1
          )

          # PocketRule version
          version_code = "11706"
          version_name = "1.17.6"

          if re.search(r"versionCode\s+\d+", text):
              text = re.sub(
                  r"versionCode\s+\d+",
                  f"versionCode {version_code}",
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "ERROR: versionCode was not found."
              )

          if re.search(
              r'versionName\s+["\'][^"\']+["\']',
              text
          ):
              text = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "ERROR: versionName was not found."
              )

          release_pattern = r'(buildTypes\s*\{\s*release\s*\{)'

          if not re.search(
              r'signingConfig\s+signingConfigs\.release',
              text
          ):
              if not re.search(
                  release_pattern,
                  text
              ):
                  raise SystemExit(
                      "ERROR: release build type was not found."
                  )

              text = re.sub(
                  release_pattern,
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1
              )

          path.write_text(text)

          print("Android release signing configured.")
          PY


      # ============================================================
      # 20. VERIFY ANDROID SIGNING CONFIGURATION
      # ============================================================

      - name: Verify Android signing configuration
        run: |
          set -euo pipefail

          echo "Checking Android signing configuration..."

          grep -n \
            -A12 \
            -B2 \
            "signingConfigs" \
            android/app/build.gradle || true

          echo ""
          echo "Checking release signing..."

          grep -n \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle


      # ============================================================
      # 21. BUILD SIGNED PRODUCTION AAB
      # ============================================================

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Cleaning previous Android build..."

          ./gradlew clean --no-daemon

          echo "Building signed PocketRule AAB..."

          ./gradlew bundleRelease --no-daemon


      # ============================================================
      # 22. VERIFY AAB EXISTS
      # ============================================================

      - name: Verify AAB
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not created."
            exit 1
          fi

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Release AAB is empty."
            exit 1
          fi

          echo "============================================"
          echo "POCKETRULE AAB SUCCESSFULLY CREATED"
          echo "============================================"

          ls -lh "$AAB"


      # ============================================================
      # 23. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signing
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -verify \
            -verbose \
            "$AAB" \
            > /tmp/jarsigner-output.txt 2>&1

          cat /tmp/jarsigner-output.txt

          echo "============================================"
          echo "AAB SIGNATURE VERIFIED"
          echo "============================================"


      # ============================================================
      # 24. UPLOAD AAB TO GITHUB
      # ============================================================

      - name: Upload PocketRule AAB
        uses: actions/upload-artifact@v4
        with:
          name: PocketRule-AAB-1.17.6-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 25. CLEANUP SIGNING MATERIAL
      # ============================================================

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/upload-keystore-original
          rm -f android/upload-keystore.jks

          if [ -f android/upload-keystore-original ]; then
            echo "ERROR: Original keystore cleanup failed."
            exit 1
          fi

          if [ -f android/upload-keystore.jks ]; then
            echo "ERROR: JKS cleanup failed."
            exit 1
          fi

          echo "Temporary signing material removed."
