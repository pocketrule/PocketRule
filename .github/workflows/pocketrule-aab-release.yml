name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL CAPACITOR PACKAGES
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true
          echo "Security audit completed."


      # ============================================================
      # 6. BUILD WEB APP
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi


      # ============================================================
      # 8. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          if [ -d "assets" ]; then
            npx -y @capacitor/assets@3.0.5 generate --android
          else
            echo "No assets directory. Skipping asset generation."
          fi


      # ============================================================
      # 9. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 10. ANDROID PERMISSIONS
      # ============================================================

      - name: Configure Android permissions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          manifest.write_text(text)

          print("Android permissions configured.")
          PY


      # ============================================================
      # 11. JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."


      # ============================================================
      # 13. DECODE KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          if [ ! -s android/upload-keystore-original ]; then
            echo "ERROR: Keystore decoding failed."
            exit 1
          fi

          chmod 600 android/upload-keystore-original

          echo "Keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/p12.txt 2>&1
          then

            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

            echo "Keystore type: PKCS12"

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/jks.txt 2>&1
          then

            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

            echo "Keystore type: JKS"

          else

            echo "ERROR: Unable to identify keystore."

            cat /tmp/p12.txt || true
            cat /tmp/jks.txt || true

            exit 1
          fi


      # ============================================================
      # 15. VERIFY KEYSTORE
      # ============================================================

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/keystore-info.txt

          if ! grep -Fq "Alias name: $KEY_ALIAS" /tmp/keystore-info.txt; then
            echo "ERROR: Alias was not found."

            echo "Available aliases:"
            grep "Alias name:" /tmp/keystore-info.txt || true

            exit 1
          fi

          echo "Keystore and alias verified."


      # ============================================================
      # 16. VERIFY PRIVATE KEY
      # ============================================================

      - name: Verify private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$EFFECTIVE_KEY_PASSWORD" \
            -file /tmp/test.csr

          rm -f /tmp/test.csr

          echo "Private key verified."


      # ============================================================
      # 17. CONFIGURE VERSION + SIGNING
      # ============================================================

      - name: Configure Android release
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION_CODE = 11711
          VERSION_NAME = "1.18.0"

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          text = path.read_text()

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          code_matches = re.findall(
              r"\bversionCode\s+\d+",
              text
          )

          if not code_matches:
              raise SystemExit(
                  "ERROR: versionCode not found."
              )

          text = re.sub(
              r"\bversionCode\s+\d+",
              f"versionCode {VERSION_CODE}",
              text
          )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          name_matches = re.findall(
              r'\bversionName\s+["\'][^"\']+["\']',
              text
          )

          if not name_matches:
              raise SystemExit(
                  "ERROR: versionName not found."
              )

          text = re.sub(
              r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "{VERSION_NAME}"',
              text
          )

          # --------------------------------------------------------
          # SIGNING CONFIG
          # --------------------------------------------------------

          signing_match = re.search(
              r"\bsigningConfigs\s*\{",
              text
          )

          signing_block = """signingConfigs {
              release {
                  storeFile file("../upload-keystore-original")
                  storeType System.getenv("KEYSTORE_TYPE")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("EFFECTIVE_KEY_PASSWORD")
              }
          }"""

          if signing_match:

              start = signing_match.start()
              brace = text.find("{", start)

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "ERROR: Could not parse signingConfigs."
                  )

              text = (
                  text[:start]
                  + signing_block
                  + text[end:]
              )

          else:

              android_match = re.search(
                  r"\bandroid\s*\{",
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              position = android_match.end()

              block = "\n\n    " + signing_block.replace(
                  "\n",
                  "\n    "
              )

              text = (
                  text[:position]
                  + block
                  + text[position:]
              )

          # --------------------------------------------------------
          # RELEASE SIGNING
          # --------------------------------------------------------

          if "signingConfig signingConfigs.release" not in text:

              release_match = re.search(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  text
              )

              if not release_match:
                  raise SystemExit(
                      "ERROR: release build type not found."
                  )

              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)

          print("Version name: 1.18.0")
          print("Version code: 11711")
          print("Release signing configured.")
          PY


      # ============================================================
      # 18. VERIFY VERSION + SIGNING
      # ============================================================

      - name: Verify Android configuration
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path(
              "android/app/build.gradle"
          ).read_text()

          codes = re.findall(
              r"\bversionCode\s+(\d+)",
              text
          )

          if len(codes) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionCode. "
                  f"Found {len(codes)}."
              )

          if codes[0] != "11711":
              raise SystemExit(
                  f"ERROR: Expected versionCode 11711. "
                  f"Found {codes[0]}."
              )

          names = re.findall(
              r'\bversionName\s+["\']([^"\']+)["\']',
              text
          )

          if len(names) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionName. "
                  f"Found {len(names)}."
              )

          if names[0] != "1.18.0":
              raise SystemExit(
                  f"ERROR: Expected versionName 1.18.0. "
                  f"Found {names[0]}."
              )

          if "signingConfig signingConfigs.release" not in text:
              raise SystemExit(
                  "ERROR: Release signing is not configured."
              )

          print("================================")
          print("ANDROID CONFIGURATION VERIFIED")
          print("================================")
          print("versionName: 1.18.0")
          print("versionCode: 11711")
          print("release signing: OK")
          print("================================")
          PY


      # ============================================================
      # 19. BUILD SIGNED AAB
      # ============================================================

      - name: Build signed release AAB
        env:
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EFFECTIVE_KEY_PASSWORD: ${{ env.EFFECTIVE_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 20. PREPARE AAB
      # ============================================================

      - name: Prepare AAB artifact
        run: |
          set -euo pipefail

          SOURCE_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          RELEASE_AAB="release/PocketRule-v1.18.0-code11711.aab"

          if [ ! -f "$SOURCE_AAB" ]; then
            echo "ERROR: AAB was not generated."
            echo ""
            echo "Available AAB files:"
            find android -type f -name "*.aab" -print || true
            exit 1
          fi

          mkdir -p release

          cp "$SOURCE_AAB" "$RELEASE_AAB"

          if [ ! -s "$RELEASE_AAB" ]; then
            echo "ERROR: Prepared AAB is empty."
            exit 1
          fi

          echo "AAB prepared successfully:"
          ls -lh "$RELEASE_AAB"


      # ============================================================
      # 21. VERIFY AAB
      # ============================================================

      - name: Verify AAB
        run: |
          set -euo pipefail

          FILE="release/PocketRule-v1.18.0-code11711.aab"

          test -f "$FILE"
          test -s "$FILE"

          SIZE=$(stat -c%s "$FILE")

          echo "================================"
          echo "AAB VERIFIED"
          echo "================================"
          echo "File: $FILE"
          echo "Size: $SIZE bytes"
          echo ""
          echo "SHA256:"
          sha256sum "$FILE"


      # ============================================================
      # 22. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        run: |
          set -euo pipefail

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/PocketRule-v1.18.0-code11711.aab

          echo "AAB signature verification passed."


      # ============================================================
      # 23. UPLOAD AAB
      # ============================================================

      - name: Upload PocketRule AAB
        id: upload_aab
        uses: actions/upload-artifact@v7
        with:
          name: PocketRule-AAB-v1.18.0-code11711
          path: release/PocketRule-v1.18.0-code11711.aab
          if-no-files-found: error
          retention-days: 30
          archive: false


      # ============================================================
      # 24. CONFIRM ARTIFACT
      # ============================================================

      - name: Confirm artifact
        env:
          ARTIFACT_URL: ${{ steps.upload_aab.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload_aab.outputs.artifact-id }}
        run: |
          set -euo pipefail

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: GitHub did not return an artifact ID."
            exit 1
          fi

          echo "================================"
          echo "POCKETRULE AAB ARTIFACT READY"
          echo "================================"
          echo "Artifact ID: $ARTIFACT_ID"
          echo "Artifact URL: $ARTIFACT_URL"
          echo "File: PocketRule-v1.18.0-code11711.aab"
          echo "Version: 1.18.0"
          echo "Version code: 11711"
          echo "================================"
