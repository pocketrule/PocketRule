name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. ENSURE REQUIRED CAPACITOR PACKAGES
      # ============================================================

      - name: Ensure Capacitor packages
        run: |
          set -euo pipefail

          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            @capacitor-community/admob@7.2.0 \
            lucide-react@1.32.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true
          echo "Security audit completed."


      # ============================================================
      # 6. VALIDATE ADMOB SECRETS
      # ============================================================

      - name: Validate AdMob secrets
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$ADMOB_APP_ID" ]; then
            echo "ERROR: ADMOB_APP_ID GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$ADMOB_BANNER_AD_UNIT_ID" ]; then
            echo "ERROR: ADMOB_BANNER_AD_UNIT_ID GitHub Secret is missing."
            exit 1
          fi

          if [[ "$ADMOB_APP_ID" != ca-app-pub-*~* ]]; then
            echo "ERROR: ADMOB_APP_ID format appears invalid."
            exit 1
          fi

          if [[ "$ADMOB_BANNER_AD_UNIT_ID" != ca-app-pub-*/* ]]; then
            echo "ERROR: ADMOB_BANNER_AD_UNIT_ID format appears invalid."
            exit 1
          fi

          echo "AdMob secrets verified."


      # ============================================================
      # 7. BUILD WEB APP
      # ============================================================

      - name: Build PocketRule
        env:
          VITE_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VITE_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          VITE_ADMOB_ENABLED: "true"
          VITE_ADMOB_TESTING: "true"
        run: |
          set -euo pipefail

          npm run build


      # ============================================================
      # 8. VERIFY WEB BUILD
      # ============================================================

      - name: Verify web build
        run: |
          set -euo pipefail

          test -d "dist" || {
            echo "ERROR: dist directory was not created."
            exit 1
          }

          test -f "dist/index.html" || {
            echo "ERROR: dist/index.html was not created."
            exit 1
          }

          echo "Web build verified."


      # ============================================================
      # 9. ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi


      # ============================================================
      # 10. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          set -euo pipefail

          if [ -d "assets" ]; then
            npx -y @capacitor/assets@3.0.4 generate --android
          else
            echo "No assets directory. Skipping asset generation."
          fi


      # ============================================================
      # 11. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: |
          set -euo pipefail

          npx cap sync android


      # ============================================================
      # 12. SETUP ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ============================================================
      # 13. INSTALL ANDROID 16 SDK
      # ============================================================

      - name: Install Android 16 SDK
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "================================"
          echo "ANDROID 16 SDK INSTALLED"
          echo "================================"
          echo "Platform: android-36"
          echo "Build tools: 36.0.0"
          echo "================================"


      # ============================================================
      # 14. CONFIGURE ADMOB ANDROID APP ID
      # ============================================================

      - name: Configure Android AdMob App ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -euo pipefail

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          mkdir -p android/app/src/main/res/values

          if [ ! -f "$STRINGS_FILE" ]; then
            cat > "$STRINGS_FILE" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
          </resources>
          EOF
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          strings = Path("android/app/src/main/res/values/strings.xml")
          manifest = Path("android/app/src/main/AndroidManifest.xml")

          app_id = os.environ["ADMOB_APP_ID"]

          text = strings.read_text()

          admob_line = (
              f'    <string name="admob_app_id">'
              f'{app_id}'
              f'</string>'
          )

          pattern = (
              r'\s*<string\s+'
              r'name=["\']admob_app_id["\']'
              r'[^>]*>.*?</string>'
          )

          if re.search(pattern, text, flags=re.DOTALL):
              text = re.sub(
                  pattern,
                  "\n" + admob_line,
                  text,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              text = text.replace(
                  "</resources>",
                  "\n" + admob_line + "\n</resources>",
                  1
              )

          strings.write_text(text)

          manifest_text = manifest.read_text()

          metadata = """        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />"""

          metadata_pattern = re.compile(
              r'\s*<meta-data\s+'
              r'android:name=["\']com\.google\.android\.gms\.ads\.APPLICATION_ID["\']'
              r'[^>]*/?>',
              re.DOTALL
          )

          if metadata_pattern.search(manifest_text):
              manifest_text = metadata_pattern.sub(
                  "\n" + metadata,
                  manifest_text,
                  count=1
              )
          else:
              application_match = re.search(
                  r'(<application\b[^>]*>)',
                  manifest_text
              )

              if not application_match:
                  raise SystemExit(
                      "ERROR: Android application element not found."
                  )

              insert_at = application_match.end()

              manifest_text = (
                  manifest_text[:insert_at]
                  + "\n"
                  + metadata
                  + manifest_text[insert_at:]
              )

          manifest.write_text(manifest_text)

          print("AdMob Android App ID configured.")
          PY


      # ============================================================
      # 15. ANDROID 16 + REQUIRED PERMISSIONS
      # ============================================================

      - name: Configure Android 16 and permissions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="com.google.android.gms.permission.AD_ID" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          for permission in permissions:
              match = re.search(
                  r'android:name="([^"]+)"',
                  permission
              )

              if not match:
                  raise SystemExit(
                      "ERROR: Could not determine permission name."
                  )

              permission_name = match.group(1)

              if (
                  f'android:name="{permission_name}"'
                  not in text
              ):
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          manifest.write_text(text)

          print("================================")
          print("ANDROID PERMISSIONS CONFIGURED")
          print("================================")
          print("AD_ID: OK")
          print("POST_NOTIFICATIONS: OK")
          print("SCHEDULE_EXACT_ALARM: OK")
          print("================================")
          PY


      # ============================================================
      # 16. FORCE COMPILE SDK 36 + TARGET SDK 36
      # ============================================================

      - name: Configure Android API 36
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          text = path.read_text()

          compile_patterns = [
              r'\bcompileSdkVersion\s+\d+',
              r'\bcompileSdk\s*=\s*\d+',
              r'\bcompileSdk\s+\d+'
          ]

          replaced_compile = False

          for pattern in compile_patterns:
              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      'compileSdk 36',
                      text,
                      count=1
                  )
                  replaced_compile = True
                  break

          if not replaced_compile:
              android_match = re.search(
                  r'\bandroid\s*\{',
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              position = android_match.end()

              text = (
                  text[:position]
                  + "\n    compileSdk 36"
                  + text[position:]
              )

          target_patterns = [
              r'\btargetSdkVersion\s+\d+',
              r'\btargetSdk\s*=\s*\d+',
              r'\btargetSdk\s+\d+'
          ]

          replaced_target = False

          for pattern in target_patterns:
              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      'targetSdk 36',
                      text,
                      count=1
                  )
                  replaced_target = True
                  break

          if not replaced_target:
              default_config_match = re.search(
                  r'\bdefaultConfig\s*\{',
                  text
              )

              if not default_config_match:
                  raise SystemExit(
                      "ERROR: defaultConfig block not found."
                  )

              position = default_config_match.end()

              text = (
                  text[:position]
                  + "\n        targetSdk 36"
                  + text[position:]
              )

          path.write_text(text)

          print("================================")
          print("ANDROID 16 CONFIGURED")
          print("================================")
          print("compileSdk: 36")
          print("targetSdk: 36")
          print("================================")
          PY


      # ============================================================
      # 17. VERIFY ADMOB + ANDROID 16
      # ============================================================

      - name: Verify Android and AdMob configuration
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -euo pipefail

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          GRADLE_FILE="android/app/build.gradle"

          test -f "$STRINGS_FILE"
          test -f "$MANIFEST_FILE"
          test -f "$GRADLE_FILE"

          grep -Fq \
            'name="admob_app_id"' \
            "$STRINGS_FILE" || {
              echo "ERROR: AdMob App ID resource missing."
              exit 1
          }

          grep -Fq \
            'com.google.android.gms.ads.APPLICATION_ID' \
            "$MANIFEST_FILE" || {
              echo "ERROR: AdMob APPLICATION_ID metadata missing."
              exit 1
          }

          grep -Fq \
            "$ADMOB_APP_ID" \
            "$STRINGS_FILE" || {
              echo "ERROR: AdMob App ID does not match secret."
              exit 1
          }

          grep -Fq \
            'com.google.android.gms.permission.AD_ID' \
            "$MANIFEST_FILE" || {
              echo "ERROR: AD_ID permission is missing."
              exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("android/app/build.gradle").read_text()

          compile_matches = re.findall(
              r'\bcompileSdk\s+(\d+)',
              text
          )

          target_matches = re.findall(
              r'\btargetSdk\s+(\d+)',
              text
          )

          if not compile_matches:
              raise SystemExit(
                  "ERROR: compileSdk not found."
              )

          if compile_matches[0] != "36":
              raise SystemExit(
                  f"ERROR: compileSdk is "
                  f"{compile_matches[0]}, expected 36."
              )

          if not target_matches:
              raise SystemExit(
                  "ERROR: targetSdk not found."
              )

          if target_matches[0] != "36":
              raise SystemExit(
                  f"ERROR: targetSdk is "
                  f"{target_matches[0]}, expected 36."
              )

          print("================================")
          print("ANDROID + ADMOB VERIFIED")
          print("================================")
          print("compileSdk: 36")
          print("targetSdk: 36")
          print("AD_ID: OK")
          print("AdMob App ID: OK")
          print("================================")
          PY


      # ============================================================
      # 18. JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 19. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."


      # ============================================================
      # 20. DECODE KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          test -s android/upload-keystore-original || {
            echo "ERROR: Keystore decoding failed."
            exit 1
          }

          chmod 600 android/upload-keystore-original

          echo "Keystore decoded successfully."


      # ============================================================
      # 21. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/p12.txt 2>&1
          then

            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

            echo "Keystore type: PKCS12"

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore-original \
            -
