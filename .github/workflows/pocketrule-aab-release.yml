name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. ENSURE REQUIRED CAPACITOR PACKAGES
      # ============================================================

      - name: Ensure Capacitor packages
        run: |
          set -euo pipefail

          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            @capacitor-community/admob@7.2.0 \
            lucide-react@1.32.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true
          echo "Security audit completed."


      # ============================================================
      # 6. VALIDATE ADMOB SECRETS
      # ============================================================

      - name: Validate AdMob secrets
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$ADMOB_APP_ID" ]; then
            echo "ERROR: ADMOB_APP_ID GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$ADMOB_BANNER_AD_UNIT_ID" ]; then
            echo "ERROR: ADMOB_BANNER_AD_UNIT_ID GitHub Secret is missing."
            exit 1
          fi

          if [[ "$ADMOB_APP_ID" != ca-app-pub-*~* ]]; then
            echo "ERROR: ADMOB_APP_ID format appears invalid."
            exit 1
          fi

          if [[ "$ADMOB_BANNER_AD_UNIT_ID" != ca-app-pub-*/* ]]; then
            echo "ERROR: ADMOB_BANNER_AD_UNIT_ID format appears invalid."
            exit 1
          fi

          echo "AdMob secrets verified."


      # ============================================================
      # 7. BUILD WEB APP
      # ============================================================

      - name: Build PocketRule
        env:
          VITE_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VITE_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          VITE_ADMOB_ENABLED: "true"
          VITE_ADMOB_TESTING: "true"
        run: |
          set -euo pipefail

          npm run build


      # ============================================================
      # 8. VERIFY WEB BUILD
      # ============================================================

      - name: Verify web build
        run: |
          set -euo pipefail

          test -d "dist" || {
            echo "ERROR: dist directory was not created."
            exit 1
          }

          test -f "dist/index.html" || {
            echo "ERROR: dist/index.html was not created."
            exit 1
          }

          echo "Web build verified."


      # ============================================================
      # 9. ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi


      # ============================================================
      # 10. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          set -euo pipefail

          if [ -d "assets" ]; then
            npx -y @capacitor/assets@3.0.4 generate --android
          else
            echo "No assets directory. Skipping asset generation."
          fi


      # ============================================================
      # 11. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: |
          set -euo pipefail

          npx cap sync android


      # ============================================================
      # 12. SETUP ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ============================================================
      # 13. INSTALL ANDROID 16 SDK
      # ============================================================

      - name: Install Android 16 SDK
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "================================"
          echo "ANDROID 16 SDK INSTALLED"
          echo "================================"
          echo "Platform: android-36"
          echo "Build tools: 36.0.0"
          echo "================================"


      # ============================================================
      # 14. CONFIGURE ADMOB ANDROID APP ID
      # ============================================================

      - name: Configure Android AdMob App ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
