name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v4
        with:
          persist-credentials: false


      # ==================================================
      # 2. SETUP NODE
      # ==================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: npm install


      # ==================================================
      # 4. INSTALL CAPACITOR PACKAGES
      # ==================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ==================================================
      # 5. SECURITY AUDIT
      # ==================================================
      # Do not stop the production build because of
      # development dependency vulnerabilities.

      - name: Security audit
        continue-on-error: true
        run: npm audit --audit-level=high


      # ==================================================
      # 6. BUILD WEB APP
      # ==================================================

      - name: Build PocketRule
        run: npm run build


      # ==================================================
      # 7. ADD ANDROID PLATFORM
      # ==================================================

      - name: Add Android platform
        run: npx cap add android


      # ==================================================
      # 8. GENERATE ANDROID ASSETS
      # ==================================================

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android


      # ==================================================
      # 9. ADD NOTIFICATION PERMISSION
      # ==================================================

      - name: Add Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          marker = (
              '<manifest '
              'xmlns:android="http://schemas.android.com/apk/res/android">'
          )

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:
              if marker not in text:
                  raise SystemExit(
                      "Could not find Android manifest root."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + permission,
                  1
              )

              manifest.write_text(text)

          print("Android notification permission configured.")
          PY


      # ==================================================
      # 10. SYNC CAPACITOR
      # ==================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ==================================================
      # 11. SETUP JAVA 21
      # ==================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==================================================
      # 12. VALIDATE SIGNING SECRETS
      # ==================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: Missing KEYSTORE_PASSWORD secret"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: Missing KEY_ALIAS secret"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: Missing KEY_PASSWORD secret"
            exit 1
          }

          echo "All signing secrets are present."


      # ==================================================
      # 13. DECODE ORIGINAL KEYSTORE
      # ==================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/upload-keystore-original

          test -s android/upload-keystore-original || {
            echo "ERROR: Original keystore could not be decoded."
            exit 1
          }

          chmod 600 android/upload-keystore-original

          echo "Original keystore decoded successfully."


      # ==================================================
      # 14. VERIFY ORIGINAL KEYSTORE
      # ==================================================

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/original-keystore.txt

          echo "Original keystore verified successfully."

          cat /tmp/original-keystore.txt


      # ==================================================
      # 15. DETECT KEYSTORE TYPE
      # ==================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore type..."

          if keytool \
              -list \
              -storetype PKCS12 \
              -keystore android/upload-keystore-original \
              -storepass "$KEYSTORE_PASSWORD" \
              > /tmp/pkcs12-test.txt 2>&1; then

            echo "Using keystore type: PKCS12"
            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

          elif keytool \
              -list \
              -storetype JKS \
              -keystore android/upload-keystore-original \
              -storepass "$KEYSTORE_PASSWORD" \
              > /tmp/jks-test.txt 2>&1; then

            echo "Using keystore type: JKS"
            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"

          else
            echo "ERROR: Could not determine keystore type."
            exit 1
          fi


      # ==================================================
      # 16. VERIFY ORIGINAL PRIVATE KEY PASSWORD
      # ==================================================

      - name: Verify original private key password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Testing original private key password..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/original-test.csr \
            > /tmp/private-key-test.txt 2>&1

          rm -f /tmp/original-test.csr

          echo "Original private key password is valid."


      # ==================================================
      # 17. CONVERT KEYSTORE TO JKS
      # ==================================================

      - name: Convert keystore to JKS
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Converting keystore to JKS..."

          rm -f android/upload-keystore.jks

          keytool \
            -importkeystore \
            -srckeystore android/upload-keystore-original \
            -srcstoretype "$KEYSTORE_TYPE" \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore android/upload-keystore.jks \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -noprompt

          test -s android/upload-keystore.jks || {
            echo "ERROR: JKS conversion failed."
            exit 1
          }

          chmod 600 android/upload-keystore.jks

          echo "JKS conversion completed successfully."


      # ==================================================
      # 18. VERIFY CONVERTED JKS
      # ==================================================

      - name: Verify converted JKS
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Verifying converted JKS..."

          keytool \
            -list \
            -v \
            -storetype JKS \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/jks-list.txt

          echo "JKS contents:"
          grep -E "Alias name:|Entry type:" /tmp/jks-list.txt || true

          echo "Testing converted private key..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/converted-test.csr

          rm -f /tmp/converted-test.csr

          echo "========================================"
          echo "Converted JKS private key verified."
          echo "========================================"


      # ==================================================
      # 19. CONFIGURE ANDROID RELEASE SIGNING
      # ==================================================

      - name: Configure Android release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle was not found."
              )

          text = path.read_text()

          # Remove previously generated signingConfigs.
          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Clean release signing configuration.
          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storeType "JKS"
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "android {" not in text:
              raise SystemExit(
                  "Could not find android block in build.gradle."
              )

          text = text.replace(
              "android {",
              "android {" + signing_config,
              1
          )

          # ------------------------------------------------
          # PocketRule version
          # ------------------------------------------------

          version_code = "11706"
          version_name = "1.17.6"

          if re.search(r"versionCode\s+\d+", text):
              text = re.sub(
                  r"versionCode\s+\d+",
                  f"versionCode {version_code}",
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionCode in build.gradle."
              )

          if re.search(
              r'versionName\s+["\'][^"\']+["\']',
              text
          ):
              text = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionName in build.gradle."
              )

          # ------------------------------------------------
          # Attach signing configuration to release build
          # ------------------------------------------------

          release_pattern = (
              r'(buildTypes\s*\{\s*release\s*\{)'
          )

          if not re.search(
              r'signingConfig\s+signingConfigs\.release',
              text
          ):
              if not re.search(
                  release_pattern,
                  text
              ):
                  raise SystemExit(
                      "Could not find release build type."
                  )

              text = re.sub(
                  release_pattern,
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1
              )

          path.write_text(text)

          print(
              "Android release signing configured successfully."
          )
          PY


      # ==================================================
      # 
