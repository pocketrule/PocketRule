name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ==================================================
      # 2. SETUP NODE
      # ==================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      #
      # npm install is intentional here.
      # We are not using npm ci because the repository
      # does not currently have a reliable package-lock.json.
      # ==================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          npm install

      # ==================================================
      # 4. INSTALL CAPACITOR RUNTIME PACKAGES
      #
      # These are used by the actual PocketRule application.
      # ==================================================

      - name: Install Capacitor runtime packages
        run: |
          set -euo pipefail

          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/local-notifications@7.0.7

      # ==================================================
      # 5. INSTALL ANDROID/BUILD TOOLING
      #
      # These packages are development/build tooling.
      # Keeping them in devDependencies prevents their
      # build-only dependency vulnerabilities from blocking
      # the production dependency audit.
      # ==================================================

      - name: Install Capacitor build tooling
        run: |
          set -euo pipefail

          npm install --save-dev \
            @capacitor/android@7.6.8 \
            @capacitor/cli@7.6.8 \
            @capacitor/assets@3.0.5

      # ==================================================
      # 6. BUILD WEB APPLICATION
      # ==================================================

      - name: Build PocketRule
        run: |
          set -euo pipefail

          npm run build

      # ==================================================
      # 7. PRODUCTION SECURITY AUDIT
      #
      # IMPORTANT:
      # Only production/runtime dependencies are checked
      # here. Development tools such as Capacitor Assets,
      # xcode and related tooling are intentionally excluded.
      # ==================================================

      - name: Security audit - production dependencies
        run: |
          set -euo pipefail

          echo "Running production dependency security audit..."

          npm audit \
            --omit=dev \
            --audit-level=high

          echo "Production dependency audit passed."

      # ==================================================
      # 8. DEVELOPMENT TOOLING AUDIT
      #
      # We still inspect the complete dependency tree.
      # However, build-only vulnerabilities do not prevent
      # creation of the Android AAB.
      # ==================================================

      - name: Security audit - development tooling
        continue-on-error: true
        run: |
          echo "Running full dependency audit for visibility..."

          npm audit --audit-level=high || true

          echo ""
          echo "Development-tool audit completed."
          echo "Build will continue because these packages are"
          echo "used only during the build process."

      # ==================================================
      # 9. ADD ANDROID PLATFORM
      # ==================================================

      - name: Add Android platform
        run: |
          set -euo pipefail

          npx cap add android

      # ==================================================
      # 10. GENERATE ANDROID ASSETS
      # ==================================================

      - name: Generate Android assets
        run: |
          set -euo pipefail

          npx @capacitor/assets generate --android

      # ==================================================
      # 11. ADD ANDROID NOTIFICATION PERMISSION
      # ==================================================

      - name: Add Android notification permission
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:

              marker = (
                  '<manifest '
                  'xmlns:android="http://schemas.android.com/apk/res/android">'
              )

              if marker not in text:
                  raise SystemExit(
                      "Could not find Android manifest root."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + permission,
                  1
              )

              manifest.write_text(text)

          print(
              "POST_NOTIFICATIONS permission verified."
          )
          PY

      # ==================================================
      # 12. SYNC CAPACITOR
      # ==================================================

      - name: Sync Capacitor
        run: |
          set -euo pipefail

          npx cap sync android

      # ==================================================
      # 13. SETUP JAVA 21
      # ==================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ==================================================
      # 14. VALIDATE SIGNING SECRETS
      # ==================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "Missing KEYSTORE_PASSWORD secret"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "Missing KEY_ALIAS secret"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "Missing KEY_PASSWORD secret"
            exit 1
          }

          echo "All signing secrets are present."

      # ==================================================
      # 15. DECODE UPLOAD KEYSTORE
      # ==================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/upload-keystore.jks

          test -s android/upload-keystore.jks || {
            echo "ERROR: Keystore could not be decoded."
            exit 1
          }

          chmod 600 android/upload-keystore.jks

          echo "Upload keystore prepared."

      # ==================================================
      # 16. CONFIGURE ANDROID RELEASE SIGNING
      # ==================================================

      - name: Configure Android release signing
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle was not found."
              )

          text = path.read_text()

          # ------------------------------------------------
          # Remove any previous PocketRule signing block.
          # ------------------------------------------------

          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # ------------------------------------------------
          # Add release signing configuration.
          # ------------------------------------------------

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "android {" not in text:
              raise SystemExit(
                  "Could not find android block."
              )

          text = text.replace(
              "android {",
              "android {" + signing_config,
              1
          )

          # ------------------------------------------------
          # Set PocketRule version.
          # ------------------------------------------------

          version_code = "11706"
          version_name = "1.17.6"

          if re.search(
              r"versionCode\s+\d+",
              text
          ):
              text = re.sub(
                  r"versionCode\s+\d+",
                  f"versionCode {version_code}",
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionCode."
              )

          if re.search(
              r'versionName\s+["\'][^"\']+["\']',
              text
          ):
              text = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionName."
              )

          # ------------------------------------------------
          # Attach signing configuration to release.
          # ------------------------------------------------

          release_pattern = (
              r'(buildTypes\s*\{\s*release\s*\{)'
          )

          if not re.search(
              r'signingConfig\s+signingConfigs\.release',
              text
          ):

              if not re.search(
                  release_pattern,
                  text
              ):
                  raise SystemExit(
                      "Could not find release build type."
                  )

              text = re.sub(
                  release_pattern,
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1
              )

          path.write_text(text)

          print(
              "Android release signing configuration prepared."
          )
          PY

      # ==================================================
      # 17. BUILD SIGNED PRODUCTION AAB
      # ==================================================

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease

      # ==================================================
      # 18. VERIFY AAB
      # ==================================================

      - name: Verify AAB
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not created."
            exit 1
          fi

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Release AAB is empty."
            exit 1
          fi

          echo "=========================================="
          echo "PocketRule AAB successfully created"
          echo "=========================================="

          ls -lh "$AAB"

      # ==================================================
      # 19. VERIFY AAB SIGNATURE
      # ==================================================

      - name: Verify AAB signing
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          jarsigner \
            -verify \
            -verbose \
            "$AAB" > /tmp/jarsigner-output.txt 2>&1 || {
              cat /tmp/jarsigner-output.txt
              echo "ERROR: AAB signature verification failed."
              exit 1
          }

          cat /tmp/jarsigner-output.txt

          echo "AAB signature verification completed."

      # ==================================================
      # 20. UPLOAD PRODUCTION AAB
      # ==================================================

      - name: Upload PocketRule AAB
        uses: actions/upload-artifact@v4
        with:
          name: PocketRule-AAB-1.17.6-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ==================================================
      # 21. CLEANUP SIGNING MATERIAL
      # ==================================================

      - name: Cleanup signing material
        if: always()
        run: |
          set -euo pipefail

          rm -f android/upload-keystore.jks

          if [ -f android/upload-keystore.jks ]; then
            echo "ERROR: Keystore cleanup failed."
            exit 1
          fi

          echo "Temporary signing material removed."
