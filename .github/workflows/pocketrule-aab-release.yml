name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout PocketRule
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # --------------------------------------------------
      # 2. Setup Node
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------------------------
      # 3. Install project dependencies
      #
      # IMPORTANT:
      # No npm cache is used because this repository
      # currently does not contain a package-lock.json.
      # npm install therefore replaces npm ci.
      # --------------------------------------------------

      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Install exact required Capacitor packages
      # --------------------------------------------------

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0

      # --------------------------------------------------
      # 5. Security audit
      # --------------------------------------------------

      - name: Security audit
        run: npm audit --audit-level=high

      # --------------------------------------------------
      # 6. Build PocketRule web application
      # --------------------------------------------------

      - name: Build PocketRule
        run: npm run build

      # --------------------------------------------------
      # 7. Add Android platform
      # --------------------------------------------------

      - name: Add Android platform
        run: npx cap add android

      # --------------------------------------------------
      # 8. Generate Android assets
      # --------------------------------------------------

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android

      # --------------------------------------------------
      # 9. Add Android notification permission
      # --------------------------------------------------

      - name: Add Android notification permission
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

              if marker not in text:
                  raise SystemExit(
                      "Could not find Android manifest root."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + permission,
                  1
              )

              manifest.write_text(text)

          print("POST_NOTIFICATIONS permission verified.")
          PY

      # --------------------------------------------------
      # 10. Sync Capacitor
      # --------------------------------------------------

      - name: Sync Capacitor
        run: npx cap sync android

      # --------------------------------------------------
      # 11. Setup Java 21
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # --------------------------------------------------
      # 12. Validate signing secrets
      # --------------------------------------------------

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "Missing KEYSTORE_PASSWORD secret"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "Missing KEY_ALIAS secret"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "Missing KEY_PASSWORD secret"
            exit 1
          }

          echo "Required signing secrets are present."

      # --------------------------------------------------
      # 13. Decode temporary upload keystore
      # --------------------------------------------------

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p android

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/upload-keystore.jks

          test -s android/upload-keystore.jks || {
            echo "ERROR: Keystore could not be decoded."
            exit 1
          }

          chmod 600 android/upload-keystore.jks

          echo "Temporary upload keystore created."

      # --------------------------------------------------
      # 14. Configure Android release signing
      # --------------------------------------------------

      - name: Configure Android release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle was not found."
              )

          text = path.read_text()

          # ------------------------------------------------
          # PocketRule release signing configuration.
          # ------------------------------------------------

          signing_block = """signingConfigs {
              release {
                  storeFile file("../upload-keystore.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }"""

          # ------------------------------------------------
          # Remove only a previously generated PocketRule
          # signing block.
          #
          # This avoids the unsafe generic nested-brace
          # regex that could damage Gradle configuration.
          # ------------------------------------------------

          generated_pattern = re.compile(
              r'\n\s*signingConfigs\s*\{\s*'
              r'release\s*\{\s*'
              r'storeFile\s+file\("\.\./upload-keystore\.jks"\)\s*'
              r'storePassword\s+System\.getenv\("KEYSTORE_PASSWORD"\)\s*'
              r'keyAlias\s+System\.getenv\("KEY_ALIAS"\)\s*'
              r'keyPassword\s+System\.getenv\("KEY_PASSWORD"\)\s*'
              r'\}\s*\}',
              re.DOTALL
          )

          text = generated_pattern.sub("", text)

          # ------------------------------------------------
          # Add clean PocketRule signing configuration.
          # ------------------------------------------------

          android_pattern = r'android\s*\{'

          if not re.search(android_pattern, text):
              raise SystemExit(
                  "Could not find android block in build.gradle."
              )

          text = re.sub(
              android_pattern,
              "android {\n    " +
              signing_block.replace("\n", "\n    "),
              text,
              count=1
          )

          # ------------------------------------------------
          # Set PocketRule version.
          # ------------------------------------------------

          version_code = "11706"
          version_name = "1.17.6"

          if re.search(r'versionCode\s+\d+', text):
              text = re.sub(
                  r'versionCode\s+\d+',
                  f'versionCode {version_code}',
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionCode in build.gradle."
              )

          if re.search(
              r'versionName\s+["\'][^"\']+["\']',
              text
          ):
              text = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionName in build.gradle."
              )

          # ------------------------------------------------
          # Attach signing configuration to release build.
          # ------------------------------------------------

          release_pattern = (
              r'(buildTypes\s*\{\s*release\s*\{)'
          )

          if not re.search(
              r'signingConfig\s+signingConfigs\.release',
              text
          ):
              if not re.search(
                  release_pattern,
                  text
              ):
                  raise SystemExit(
                      "Could not find release build type."
                  )

              text = re.sub(
                  release_pattern,
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1
              )

          path.write_text(text)

          print(
              "Android release signing configuration prepared."
          )
          PY

      # --------------------------------------------------
      # 15. Build signed production AAB
      # --------------------------------------------------

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease

      # --------------------------------------------------
      # 16. Verify AAB exists
      # --------------------------------------------------

      - name: Verify AAB
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not created."
            exit 1
          fi

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Release AAB is empty."
            exit 1
          fi

          echo "========================================"
          echo "PocketRule AAB successfully created"
          echo "========================================"

          ls -lh "$AAB"

      # --------------------------------------------------
      # 17. Verify AAB signing
      # --------------------------------------------------

      - name: Verify AAB signing
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          jarsigner \
            -verify \
            -verbose \
            "$AAB" > /tmp/jarsigner-output.txt 2>&1 || {
              cat /tmp/jarsigner-output.txt
              echo "ERROR: AAB signature verification failed."
              exit 1
          }

          cat /tmp/jarsigner-output.txt

          echo "AAB signature verification completed."

      # --------------------------------------------------
      # 18. Upload production AAB
      # --------------------------------------------------

      - name: Upload PocketRule AAB
        uses: actions/upload-artifact@v4
        with:
          name: PocketRule-AAB-1.17.6-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 19. Cleanup signing material
      # --------------------------------------------------

      - name: Cleanup signing material
        if: always()
        run: |
          set -euo pipefail

          rm -f android/upload-keystore.jks

          if [ -f android/upload-keystore.jks ]; then
            echo "ERROR: Keystore cleanup failed."
            exit 1
          fi

          echo "Temporary signing material removed."
