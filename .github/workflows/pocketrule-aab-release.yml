name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL CAPACITOR PACKAGES
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      # Security findings are reported but must NOT prevent
      # the Android production build from running.

      - name: Security audit
        run: |
          npm audit --audit-level=high || {
            echo ""
            echo "WARNING: npm audit reported dependency vulnerabilities."
            echo "These findings do not block the PocketRule AAB build."
          }


      # ============================================================
      # 6. BUILD POCKETRULE WEB APP
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ADD ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: npx cap add android


      # ============================================================
      # 8. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android


      # ============================================================
      # 9. ADD ANDROID NOTIFICATION PERMISSIONS
      # ============================================================

      - name: Add Android notification permissions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          marker = (
              '<manifest '
              'xmlns:android="http://schemas.android.com/apk/res/android">'
          )

          if marker not in text:
              raise SystemExit(
                  "ERROR: Android manifest root was not found."
              )

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
          ]

          missing = [
              permission
              for permission in permissions
              if permission not in text
          ]

          if missing:
              text = text.replace(
                  marker,
                  marker
                  + "\n    "
                  + "\n    ".join(missing),
                  1
              )

              manifest.write_text(text)

          print(
              "Android notification and exact-alarm "
              "permissions configured."
          )
          PY


      # ============================================================
      # 10. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 11. SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All signing secrets are present."


      # ============================================================
      # 13. DECODE ORIGINAL KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          if [ ! -s android/upload-keystore-original ]; then
            echo "ERROR: Keystore decoding failed."
            exit 1
          fi

          chmod 600 android/upload-keystore-original

          echo "Original keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore type..."

          if keytool \
              -list \
              -storetype PKCS12 \
              -keystore android/upload-keystore-original \
              -storepass "$KEYSTORE_PASSWORD" \
              > /tmp/pkcs12-test.txt 2>&1
          then

            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "Detected keystore type: PKCS12"

          elif keytool \
              -list \
              -storetype JKS \
              -keystore android/upload-keystore-original \
              -storepass "$KEYSTORE_PASSWORD" \
              > /tmp/jks-test.txt 2>&1
          then

            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "Detected keystore type: JKS"

          else

            echo "ERROR: Could not identify the keystore type."
            echo ""
            echo "PKCS12 test:"
            cat /tmp/pkcs12-test.txt || true
            echo ""
            echo "JKS test:"
            cat /tmp/jks-test.txt || true

            exit 1
          fi


      # ============================================================
      # 15. VERIFY ORIGINAL KEYSTORE + ALIAS
      # ============================================================

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Checking original keystore..."

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/original-keystore.txt

          echo "Checking requested alias..."

          if ! grep -Fq \
            "Alias name: $KEY_ALIAS" \
            /tmp/original-keystore.txt
          then

            echo "ERROR: KEY_ALIAS was not found."
            echo ""
            echo "Available aliases:"
            grep "Alias name:" \
              /tmp/original-keystore.txt || true

            exit 1
          fi

          echo "Original keystore and alias verified."


      # ============================================================
      # 16. VERIFY ORIGINAL PRIVATE KEY
      # ============================================================

      - name: Verify original private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Testing original private key..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/private-key-test.csr

          rm -f /tmp/private-key-test.csr

          echo "Original private key verified."


      # ============================================================
      # 17. PREPARE JKS SIGNING KEYSTORE
      # ============================================================

      - name: Prepare JKS signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          rm -f android/upload-keystore.jks

          if [ "$KEYSTORE_TYPE" = "JKS" ]; then

            echo "Original keystore is already JKS."

            cp \
              android/upload-keystore-original \
              android/upload-keystore.jks

          else

            echo "Original keystore is PKCS12."
            echo "Converting PKCS12 to JKS..."

            keytool \
              -importkeystore \
              -srckeystore android/upload-keystore-original \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -destkeystore android/upload-keystore.jks \
              -deststoretype JKS \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEY_PASSWORD" \
              -destalias "$KEY_ALIAS" \
              -noprompt

          fi

          if [ ! -s android/upload-keystore.jks ]; then
            echo "ERROR: JKS keystore was not created."
            exit 1
          fi

          chmod 600 android/upload-keystore.jks

          echo "JKS signing keystore prepared."


      # ============================================================
      # 18. VERIFY JKS SIGNING KEYSTORE
      # ============================================================

      - name: Verify JKS signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Verifying JKS..."

          keytool \
            -list \
            -v \
            -storetype JKS \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/jks-info.txt

          if ! grep -Fq \
            "Alias name: $KEY_ALIAS" \
            /tmp/jks-info.txt
          then

            echo "ERROR: Alias was not found in JKS."
            grep "Alias name:" \
              /tmp/jks-info.txt || true

            exit 1
          fi

          echo "Testing JKS private key..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/jks-private-key-test.csr

          rm -f /tmp/jks-private-key-test.csr

          echo "JKS and private key verified successfully."


      # ============================================================
      # 19. CONFIGURE ANDROID RELEASE SIGNING + VERSION
      # ============================================================

      - name: Configure Android release signing and version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle was not found."
              )

          text = path.read_text()

          # --------------------------------------------------------
          # PocketRule release version
          # --------------------------------------------------------

          VERSION_CODE = 11708
          VERSION_NAME = "1.17.8"

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          code_matches = list(
              re.finditer(
                  r"\bversionCode\s+(\d+)",
                  text
              )
          )

          if not code_matches:
              raise SystemExit(
                  "ERROR: versionCode was not found."
              )

          # Replace every existing versionCode declaration so
          # there cannot be an accidental duplicate old value.
          text = re.sub(
              r"\bversionCode\s+\d+",
              f"versionCode {VERSION_CODE}",
              text
          )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          name_matches = list(
              re.finditer(
                  r'\bversionName\s+["\']([^"\']+)["\']',
                  text
              )
          )

          if not name_matches:
              raise SystemExit(
                  "ERROR: versionName was not found."
              )

          text = re.sub(
              r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "{VERSION_NAME}"',
              text
          )

          # --------------------------------------------------------
          # SIGNING CONFIG
          # --------------------------------------------------------

          signing_block = """
        signingConfigs {
            release {
                storeFile file("../upload-keystore.jks")
                storeType "JKS"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
          """

          if "signingConfigs {" not in text:

              android_match = re.search(
                  r'\bandroid\s*\{',
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android {} block was not found."
                  )

              insert_at = android_match.end()

              text = (
                  text[:insert_at]
                  + signing_block
                  + text[insert_at:]
              )

          # --------------------------------------------------------
          # RELEASE SIGNING
          # --------------------------------------------------------

          if not re.search(
              r"signingConfig\s+signingConfigs\.release",
              text
          ):

              release_match = re.search(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  text
              )

              if not release_match:
                  raise SystemExit(
                      "ERROR: release build type was not found."
                  )

              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)

          print("============================================")
          print("ANDROID RELEASE CONFIGURATION")
          print("============================================")
          print(f"versionName = {VERSION_NAME}")
          print(f"versionCode = {VERSION_CODE}")
          print("release signing = CONFIGURED")
          print("============================================")
          PY


      # ============================================================
      # 20. VERIFY ANDROID SIGNING + VERSION
      # ============================================================

      - name: Verify Android signing and version configuration
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle was not found."
              )

          text = path.read_text()

          # --------------------------------------------------------
          # Verify release signing
          # --------------------------------------------------------

          if "signingConfig signingConfigs.release" not in text:
              raise SystemExit(
                  "ERROR: Release signing configuration is missing."
              )

          if "storeFile file(\"../upload-keystore.jks\")" not in text:
              raise SystemExit(
                  "ERROR: Upload JKS store file configuration is missing."
              )

          # --------------------------------------------------------
          # Verify versionCode
          # --------------------------------------------------------

          code_matches = re.findall(
              r"\bversionCode\s+(\d+)",
              text
          )

          if len(code_matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one versionCode declaration, "
                  f"found {len(code_matches)}."
              )

          version_code = int(code_matches[0])

          if version_code != 11708:
              raise SystemExit(
                  "ERROR: Expected versionCode 11708, "
                  f"but found {version_code}."
              )

          # --------------------------------------------------------
          # Verify versionName
          # --------------------------------------------------------

          name_matches = re.findall(
              r'\bversionName
