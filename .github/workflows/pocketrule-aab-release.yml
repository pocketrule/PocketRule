name: PocketRule AAB - Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL CAPACITOR
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        run: |
          npm audit --audit-level=high || true


      # ============================================================
      # 6. BUILD WEB APP
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists."
          else
            npx cap add android
          fi


      # ============================================================
      # 8. ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android


      # ============================================================
      # 9. ANDROID PERMISSIONS
      # ============================================================

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          application_tag = "<application"

          if application_tag not in text:
              raise SystemExit(
                  "Android application tag not found."
              )

          missing = [
              p for p in permissions
              if p not in text
          ]

          if missing:
              position = text.find(application_tag)

              text = (
                  text[:position]
                  + "\n    "
                  + "\n    ".join(missing)
                  + "\n\n    "
                  + text[position:]
              )

              manifest.write_text(text)

          print("Android permissions configured.")
          PY


      # ============================================================
      # 10. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 11. JAVA 21
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Signing secrets are present."


      # ============================================================
      # 13. DECODE KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          test -s android/upload-keystore-original

          chmod 600 android/upload-keystore-original

          echo "Keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null 2>&1
          then

            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "Keystore type: PKCS12"

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null 2>&1
          then

            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "Keystore type: JKS"

          else

            echo "ERROR: Could not identify keystore."
            exit 1

          fi


      # ============================================================
      # 15. VERIFY KEYSTORE
      # ============================================================

      - name: Verify upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keystore-info.txt

          if ! grep -Fq \
            "Alias name: $KEY_ALIAS" \
            /tmp/keystore-info.txt
          then
            echo "ERROR: Alias not found."
            exit 1
          fi

          echo "Upload keystore verified."


      # ============================================================
      # 16. VERIFY PRIVATE KEY
      # ============================================================

      - name: Verify private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/private-key-test.csr

          rm -f /tmp/private-key-test.csr

          echo "Private key verified."


      # ============================================================
      # 17. CREATE JKS SIGNING KEYSTORE
      # ============================================================

      - name: Prepare JKS signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          rm -f android/upload-keystore.jks

          if [ "$KEYSTORE_TYPE" = "JKS" ]; then

            cp \
              android/upload-keystore-original \
              android/upload-keystore.jks

          else

            keytool \
              -importkeystore \
              -srckeystore android/upload-keystore-original \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -destkeystore android/upload-keystore.jks \
              -deststoretype JKS \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEY_PASSWORD" \
              -destalias "$KEY_ALIAS" \
              -noprompt

          fi

          test -s android/upload-keystore.jks

          chmod 600 android/upload-keystore.jks

          echo "JKS signing keystore ready."


      # ============================================================
      # 18. VERIFY JKS
      # ============================================================

      - name: Verify JKS signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -storetype JKS \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/jks-info.txt

          grep -Fq \
            "Alias name: $KEY_ALIAS" \
            /tmp/jks-info.txt

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/jks-private-key-test.csr

          rm -f /tmp/jks-private-key-test.csr

          echo "JKS verified."


      # ============================================================
      # 19. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure Android release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle not found."
              )

          text = path.read_text()

          VERSION_CODE = "11708"
          VERSION_NAME = "1.17.8"

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          matches = re.findall(
              r"\bversionCode\s+\d+",
              text
          )

          if not matches:
              raise SystemExit(
                  "versionCode not found."
              )

          text = re.sub(
              r"\bversionCode\s+\d+",
              f"versionCode {VERSION_CODE}",
              text
          )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          matches = re.findall(
              r'\bversionName\s+["\'][^"\']+["\']',
              text
          )

          if not matches:
              raise SystemExit(
                  "versionName not found."
              )

          text = re.sub(
              r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "{VERSION_NAME}"',
              text
          )

          # --------------------------------------------------------
          # SIGNING CONFIG
          # --------------------------------------------------------

          signing_start = text.find(
              "signingConfigs {"
          )

          if signing_start == -1:

              android_start = text.find(
                  "android {"
              )

              if android_start == -1:
                  raise SystemExit(
                      "android block not found."
                  )

              insert_at = android_start + len(
                  "android {"
              )

              signing_config = """
          signingConfigs {
              release {
                  storeFile file("../upload-keystore.jks")
                  storeType "JKS"
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          """

              text = (
                  text[:insert_at]
                  + signing_config
                  + text[insert_at:]
              )

          else:

              if "release {" not in text[signing_start:]:
                  insert_at = text.find(
                      "{",
                      signing_start
                  ) + 1

                  release_config = """
              release {
                  storeFile file("../upload-keystore.jks")
                  storeType "JKS"
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
                  """

                  text = (
                      text[:insert_at]
                      + release_config
                      + text[insert_at:]
                  )

          # --------------------------------------------------------
          # RELEASE SIGNING
          # --------------------------------------------------------

          if (
              "signingConfig signingConfigs.release"
              not in text
          ):

              match = re.search(
                  r"buildTypes\s*\{\s*release\s*\{",
                  text
              )

              if not match:
                  raise SystemExit(
                      "release build type not found."
                  )

              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n"
                  r"            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)

          print(
              "Release configuration written."
          )
          PY


      # ============================================================
      # 20. FINAL CONFIGURATION VERIFICATION
      # ============================================================

      - name: Verify final Android configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path(
              "android/app/build.gradle"
          ).read_text()

          # Signing
          if (
              "signingConfig signingConfigs.release"
              not in text
          ):
              raise SystemExit(
                  "ERROR: Release signing missing."
              )

          # Version code
          codes = re.findall(
              r"\bversionCode\s+(\d+)",
              text
          )

          if len(codes) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one versionCode."
              )

          if codes[0] != "11708":
              raise SystemExit(
                  f"ERROR: Expected 11708, found {codes[0]}."
              )

          # Version name
          names = re.findall(
              r'\bversionName\s+["\']([^"\']+)["\']',
              text
          )

          if len(names) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one versionName."
              )

          if names[0] != "1.17.8":
              raise SystemExit(
                  f"ERROR: Expected 1.17.8, found {names[0]}."
              )

          print("================================")
          print("ANDROID CONFIGURATION VERIFIED")
          print("Version     : 1.17.8")
          print("VersionCode : 11708")
          print("Signing     : CONFIGURED")
          print("================================")
          PY


      # ============================================================
      # 21. BUILD SIGNED AAB
      # ============================================================

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean --no-daemon

          ./gradlew bundleRelease --no-daemon


      # ============================================================
      # 22. VERIFY AAB
      # ============================================================

      - name: Verify release AAB
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not created."

            find android/app/build/outputs \
              -type f \
              -name "*.aab" \
              -print || true

            exit 1
          fi

          if [ ! -s "$AAB" ]; then
            echo "ERROR: AAB is empty."
            exit 1
          fi

          echo "Release AAB created:"
          ls -lh "$AAB"


      # ============================================================
      # 23. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB" \
            > /tmp/aab-signature.txt 2>&1

          if grep -q "jar verified" \
            /tmp/aab-signature.txt
          then
            echo "AAB signature verified."
          else
            cat /tmp/aab-signature.txt
            echo "ERROR: AAB signature verification failed."
            exit 1
          fi


      # ============================================================
      # 24. UPLOAD AAB
      # ============================================================

      - name: Upload PocketRule AAB
        uses: actions/upload-artifact@v4
        with:
          name: PocketRule-AAB-1.17.8-11708
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 2
