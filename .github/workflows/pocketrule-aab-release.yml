name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ==================================================
      # 2. SETUP NODE
      # ==================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: npm install

      # ==================================================
      # 4. INSTALL CAPACITOR PACKAGES
      # ==================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0

      # ==================================================
      # 5. SECURITY AUDIT
      # ==================================================

      - name: Security audit
        run: |
          npm audit --audit-level=high || true

      # ==================================================
      # 6. BUILD POCKETRULE
      # ==================================================

      - name: Build PocketRule
        run: npm run build

      # ==================================================
      # 7. ADD ANDROID PLATFORM
      # ==================================================

      - name: Add Android platform
        run: npx cap add android

      # ==================================================
      # 8. GENERATE ANDROID ASSETS
      # ==================================================

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android

      # ==================================================
      # 9. ADD NOTIFICATION PERMISSION
      # ==================================================

      - name: Add Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:
              if marker not in text:
                  raise SystemExit(
                      "Could not find Android manifest root."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + permission,
                  1
              )

          manifest.write_text(text)
          PY

      # ==================================================
      # 10. SYNC CAPACITOR
      # ==================================================

      - name: Sync Capacitor
        run: npx cap sync android

      # ==================================================
      # 11. SETUP JAVA
      # ==================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ==================================================
      # 12. VALIDATE SIGNING SECRETS
      # ==================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking signing secrets..."

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: Missing KEYSTORE_PASSWORD secret."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: Missing KEY_ALIAS secret."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: Missing KEY_PASSWORD secret."
            exit 1
          }

          echo "All signing secrets are present."

      # ==================================================
      # 13. DECODE KEYSTORE
      # ==================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "Decoding upload keystore..."

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/upload-keystore.jks

          test -s android/upload-keystore.jks || {
            echo "ERROR: Keystore could not be decoded."
            exit 1
          }

          chmod 600 android/upload-keystore.jks

          echo "Keystore decoded successfully."

      # ==================================================
      # 14. DETECT ACTUAL KEYSTORE TYPE
      # ==================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore format..."

          keytool_output="$(
            keytool \
              -list \
              -v \
              -keystore android/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              2>&1
          )"

          echo "$keytool_output" > /tmp/keystore-type-check.txt

          echo "$keytool_output" | grep "Keystore type:" || {
            echo "ERROR: Could not determine keystore type."
            cat /tmp/keystore-type-check.txt
            exit 1
          }

          KEYSTORE_TYPE="$(
            echo "$keytool_output" \
              | grep "Keystore type:" \
              | head -1 \
              | sed 's/.*Keystore type: *//'
          )"

          if [ -z "$KEYSTORE_TYPE" ]; then
            echo "ERROR: Keystore type is empty."
            exit 1
          fi

          echo "Detected keystore type: $KEYSTORE_TYPE"

          echo "KEYSTORE_TYPE=$KEYSTORE_TYPE" >> "$GITHUB_ENV"

      # ==================================================
      # 15. VERIFY KEYSTORE AND ALIAS
      # ==================================================

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Checking keystore and alias..."

          keytool \
            -list \
            -v \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/keystore-check.txt 2>&1 || {
              cat /tmp/keystore-check.txt
              echo ""
              echo "ERROR: Keystore verification failed."
              echo "Check KEYSTORE_PASSWORD and KEY_ALIAS."
              exit 1
          }

          echo "Keystore password and alias are valid."

      # ==================================================
      # 16. VERIFY PRIVATE KEY PASSWORD
      # ==================================================

      - name: Verify private key password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Testing private key password..."

          rm -f /tmp/pocketrule-signing-test.p12

          keytool \
            -importkeystore \
            -srckeystore android/upload-keystore.jks \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore /tmp/pocketrule-signing-test.p12 \
            -deststoretype PKCS12 \
            -deststorepass "temporary-test-password" \
            -noprompt \
            > /tmp/key-test.txt 2>&1 || {
              cat /tmp/key-test.txt
              echo ""
              echo "ERROR: PRIVATE KEY PASSWORD IS NOT VALID."
              echo ""
              echo "The keystore opens, but KEY_PASSWORD cannot unlock the private key."
              exit 1
          }

          rm -f /tmp/pocketrule-signing-test.p12

          echo "Private key password is valid."

      # ==================================================
      # 17. CONFIGURE ANDROID SIGNING
      # ==================================================

      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Remove previously generated signing configuration.
          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          signing_config = '''
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storeType System.getenv("KEYSTORE_TYPE")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''

          if "android {" not in text:
              raise SystemExit(
                  "Could not find android block in build.gradle."
              )

          text = text.replace(
              "android {",
              "android {" + signing_config,
              1
          )

          # PocketRule version.
          version_code = "11706"
          version_name = "1.17.6"

          if re.search(r"versionCode\s+\d+", text):
              text = re.sub(
                  r"versionCode\s+\d+",
                  f"versionCode {version_code}",
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionCode in build.gradle."
              )

          if re.search(
              r'versionName\s+["\'][^"\']+["\']',
              text
          ):
              text = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionName in build.gradle."
              )

          # Attach release signing.
          release_pattern = (
              r'(buildTypes\s*\{\s*release\s*\{)'
          )

          if not re.search(
              r'signingConfig\s+signingConfigs\.release',
              text
          ):
              if not re.search(
                  release_pattern,
                  text
              ):
                  raise SystemExit(
                      "Could not find release build type."
                  )

              text = re.sub(
                  release_pattern,
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1
              )

          path.write_text(text)

          print("Android release signing configuration prepared.")
          print("PocketRule version: 1.17.6")
          print("Version code: 11706")
          PY

      # ==================================================
      # 18. BUILD SIGNED AAB
      # ==================================================

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
        run: |
          set -euo pipefail

          echo "Using keystore type: $KEYSTORE_TYPE"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease --stacktrace

      # ==================================================
      # 19. VERIFY AAB
      # ==================================================

      - name: Verify AAB
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not created."
            exit 1
          fi

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Release AAB is empty."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PocketRule AAB successfully created!"
          echo "=========================================="
          echo ""

          ls -lh "$AAB"

      # ==================================================
      # 20. VERIFY AAB SIGNATURE
      # ==================================================

      - name: Verify AAB signing
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -verify \
            -verbose \
            "$AAB" \
            > /tmp/jarsigner-output.txt 2>&1 || {
              cat /tmp/jarsigner-output.txt
              echo "ERROR: AAB signature verification failed."
              exit 1
          }

          cat /tmp/jarsigner-output.txt

          echo ""
          echo "AAB signature verification completed successfully."

      # ==================================================
      # 21. UPLOAD AAB
      # ==================================================

      - name: Upload PocketRule AAB
        uses: actions/upload-artifact@v4
        with:
          name: PocketRule-AAB-1.17.6-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ==================================================
      # 22. CLEANUP
      # ==================================================

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/upload-keystore.jks
          rm -f /tmp/pocketrule-signing-test.p12
          rm -f /tmp/keystore-check.txt
          rm -f /tmp/key-test.txt
          rm -f /tmp/keystore-type-check.txt

          if [ -f android/upload-keystore.jks ]; then
            echo "ERROR: Keystore cleanup failed."
            exit 1
          fi

          echo "Temporary signing material removed."
