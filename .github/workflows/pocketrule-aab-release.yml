name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    env:
      VERSION_NAME: "1.17.9"
      VERSION_CODE: "11709"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL REQUIRED CAPACITOR PACKAGES
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================
      #
      # Vulnerabilities are reported but do not block the release
      # build. This prevents npm audit findings from stopping the
      # production AAB.
      #

      - name: Security audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true
          echo ""
          echo "Security audit completed."
          echo "Audit findings do not block the AAB build."


      # ============================================================
      # 6. BUILD WEB APPLICATION
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ADD ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: npx cap add android


      # ============================================================
      # 8. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android


      # ============================================================
      # 9. ADD ANDROID NOTIFICATION PERMISSIONS
      # ============================================================

      - name: Configure Android permissions
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          manifest_open = text.find("<manifest")

          if manifest_open == -1:
              raise SystemExit(
                  "ERROR: <manifest> element was not found."
              )

          manifest_end = text.find(">", manifest_open)

          if manifest_end == -1:
              raise SystemExit(
                  "ERROR: Could not locate manifest opening tag."
              )

          insertion_point = manifest_end + 1

          missing = [
              permission
              for permission in permissions
              if permission not in text
          ]

          if missing:
              addition = "\n" + "\n".join(
                  f"    {permission}"
                  for permission in missing
              ) + "\n"

              text = (
                  text[:insertion_point]
                  + addition
                  + text[insertion_point:]
              )

              manifest.write_text(text)

          print("Android permissions configured successfully.")
          PY


      # ============================================================
      # 10. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 11. SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" \
            || { echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."; exit 1; }

          test -n "$KEYSTORE_PASSWORD" \
            || { echo "ERROR: KEYSTORE_PASSWORD is missing."; exit 1; }

          test -n "$KEY_ALIAS" \
            || { echo "ERROR: KEY_ALIAS is missing."; exit 1; }

          test -n "$KEY_PASSWORD" \
            || { echo "ERROR: KEY_PASSWORD is missing."; exit 1; }

          echo "All signing secrets are present."


      # ============================================================
      # 13. DECODE ORIGINAL KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore

          if [ ! -s android/upload-keystore ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          chmod 600 android/upload-keystore

          echo "Keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore type..."

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/pkcs12-test.txt 2>&1
          then
            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "Detected PKCS12 keystore."

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/jks-test.txt 2>&1
          then
            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "Detected JKS keystore."

          else
            echo "ERROR: Unable to identify keystore type."
            echo ""
            echo "PKCS12 test:"
            cat /tmp/pkcs12-test.txt || true
            echo ""
            echo "JKS test:"
            cat /tmp/jks-test.txt || true
            exit 1
          fi


      # ============================================================
      # 15. VERIFY KEYSTORE AND ALIAS
      # ============================================================

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Verifying keystore..."

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keystore-info.txt

          echo "Checking alias..."

          if ! grep -Fq "Alias name: $KEY_ALIAS" /tmp/keystore-info.txt; then
            echo "ERROR: Alias '$KEY_ALIAS' was not found."

            echo ""
            echo "Available aliases:"
            grep "Alias name:" /tmp/keystore-info.txt || true

            exit 1
          fi

          echo "Keystore and alias verified."


      # ============================================================
      # 16. VERIFY PRIVATE KEY
      # ============================================================

      - name: Verify private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Testing private key..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/private-key-test.csr

          rm -f /tmp/private-key-test.csr

          echo "Private key verified successfully."


      # ============================================================
      # 17. CONFIGURE ANDROID SIGNING + VERSION
      # ============================================================

      - name: Configure Android release signing and version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle was not found."
              )

          text = path.read_text()

          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          text, code_count = re.subn(
              r'\bversionCode\s+\d+',
              f'versionCode {version_code}',
              text
          )

          if code_count == 0:
              raise SystemExit(
                  "ERROR: No versionCode declaration was found."
              )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          text, name_count = re.subn(
              r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "{version_name}"',
              text
          )

          if name_count == 0:
              raise SystemExit(
                  "ERROR: No versionName declaration was found."
              )

          # --------------------------------------------------------
          # SIGNING CONFIG
          # --------------------------------------------------------

          signing_config = """
            signingConfigs {
                release {
                    storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                    storeType System.getenv("KEYSTORE_TYPE")
                    storePassword System.getenv("KEYSTORE_PASSWORD")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASSWORD")
                }
            }
          """

          if "signingConfigs {" not in text:
              android_match = re.search(
                  r'\bandroid\s*\{',
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block was not found."
                  )

              insert_at = android_match.end()

              text = (
                  text[:insert_at]
                  + signing_config
                  + text[insert_at:]
              )

          else:
              # Replace an existing release signing config if present.
              release_pattern = re.compile(
                  r'(?s)signingConfigs\s*\{.*?\n\s*\}',
                  re.MULTILINE
              )

              # Do not aggressively replace an existing signingConfigs
              # block. The verification step below will ensure that the
              # release configuration is correct.
              
          # --------------------------------------------------------
          # RELEASE BUILD TYPE
          # --------------------------------------------------------

          release_signing = "signingConfig signingConfigs.release"

          if release_signing not in text:

              release_match = re.search(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  text
              )

              if not release_match:
                  raise SystemExit(
                      "ERROR: release build type was not found."
                  )

              text = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1
              )

          path.write_text(text)

          print("Android configuration updated.")
          print(f"Version name: {version_name}")
          print(f"Version code: {version_code}")
          PY

        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}


      # ============================================================
      # 18. VERIFY CONFIGURATION BEFORE BUILD
      # ============================================================

      - name: Verify Android signing and version configuration
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          path = Path("android/app/build.gradle")
          text = path.read_text()

          expected_code = os.environ["VERSION_CODE"]
          expected_name = os.environ["VERSION_NAME"]

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          codes = re.findall(
              r'\bversionCode\s+(\d+)',
              text
          )

          if len(codes) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionCode. "
                  f"Found {len(codes)}."
              )

          if codes[0] != expected_code:
              raise SystemExit(
                  f"ERROR: Expected versionCode {expected_code}, "
                  f"found {codes[0]}."
              )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          names = re.findall(
              r'\bversionName\s+["\']([^"\']+)["\']',
              text
          )

          if len(names) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionName. "
                  f"Found {len(names)}."
              )

          if names[0] != expected_name:
              raise SystemExit(
                  f"ERROR: Expected versionName {expected_name}, "
                  f"found {names[0]}."
              )

          # --------------------------------------------------------
          # SIGNING
          # --------------------------------------------------------

          required = [
              "signingConfig signingConfigs.release",
              'storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))',
              'storeType System.getenv("KEYSTORE_TYPE")',
              'storePassword System.getenv("KEYSTORE_PASSWORD")',
              'keyAlias System.getenv("KEY_ALIAS")',
              'keyPassword System.getenv("KEY_PASSWORD")'
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      f"ERROR: Missing signing configuration: {item}"
                  )

          print("============================================")
          print("ANDROID CONFIGURATION VERIFIED")
          print("============================================")
          print(f"versionName: {expected_name}")
          print(f"versionCode: {expected_code}")
          print("release signing: configured")
          print("============================================")
          PY


      # ============================================================
      # 19. BUILD SIGNED RELEASE AAB
      # ============================================================

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/upload-keystore
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Building PocketRule release AAB..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:bundleRelease

          echo ""
          echo "Searching for generated AAB..."

          find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print

          AAB_COUNT=$(find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            | wc -l)

          if [ "$AAB_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one release AAB."
            echo "Found: $AAB_COUNT"
            exit 1
          fi

          AAB_PATH=$(find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            | head -n 1)

          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "AAB successfully created:"
          echo "$AAB_PATH"


      # ============================================================
      # 20. VERIFY AAB EXISTS
      # ============================================================

      - name: Verify AAB
        run: |
          set -euo pipefail

          if [ -z "${AAB_PATH:-}" ]; then
            echo "ERROR: AAB_PATH is empty."
            exit 1
          fi

          if [ ! -f "android/$AAB_PATH" ]; then
            echo "ERROR: AAB file does
