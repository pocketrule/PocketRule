name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout PocketRule
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # --------------------------------------------------
      # 2. Setup Node
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Install Capacitor packages
      # --------------------------------------------------

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0

      # --------------------------------------------------
      # 5. Build PocketRule
      # --------------------------------------------------

      - name: Build PocketRule
        run: npm run build

      # --------------------------------------------------
      # 6. Add Android platform
      # --------------------------------------------------

      - name: Add Android platform
        run: npx cap add android

      # --------------------------------------------------
      # 7. Generate Android assets
      # --------------------------------------------------

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android

      # --------------------------------------------------
      # 8. Add notification permission
      # --------------------------------------------------

      - name: Add Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

              if marker not in text:
                  raise SystemExit(
                      "Could not find Android manifest root."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + permission,
                  1
              )

          manifest.write_text(text)
          PY

      # --------------------------------------------------
      # 9. Sync Capacitor
      # --------------------------------------------------

      - name: Sync Capacitor
        run: npx cap sync android

      # --------------------------------------------------
      # 10. Setup Java
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # --------------------------------------------------
      # 11. Validate signing secrets
      # --------------------------------------------------

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "Missing KEYSTORE_PASSWORD secret"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "Missing KEY_ALIAS secret"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "Missing KEY_PASSWORD secret"
            exit 1
          }

          echo "All signing secrets are present."

      # --------------------------------------------------
      # 12. Decode upload keystore
      # --------------------------------------------------

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/upload-keystore.jks

          test -s android/upload-keystore.jks || {
            echo "Keystore could not be decoded."
            exit 1
          }

          chmod 600 android/upload-keystore.jks

          echo "Keystore decoded successfully."

      # --------------------------------------------------
      # 13. Detect keystore type
      # --------------------------------------------------

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore type..."

          keytool \
            -list \
            -v \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keystore-info.txt

          if grep -q "Keystore type: PKCS12" /tmp/keystore-info.txt; then
            echo "Using keystore type: PKCS12"
          elif grep -q "Keystore type: JKS" /tmp/keystore-info.txt; then
            echo "Using keystore type: JKS"
          else
            echo "Could not determine keystore type."
            exit 1
          fi

      # --------------------------------------------------
      # 14. Verify keystore
      # --------------------------------------------------

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Verifying keystore..."

          keytool \
            -list \
            -v \
            -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/key-info.txt

          echo "Keystore and alias are valid."

      # --------------------------------------------------
      # 15. Verify private key password
      # --------------------------------------------------

      - name: Verify private key password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Testing private key password..."

          keytool \
            -importkeystore \
            -srckeystore android/upload-keystore.jks \
            -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore /tmp/pocketrule-key-test.jks \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt \
            > /tmp/key-password-test.txt 2>&1

          echo "Private key password is valid."

          rm -f /tmp/pocketrule-key-test.jks

      # --------------------------------------------------
      # 16. Configure Android release signing
      # --------------------------------------------------

      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Remove previously injected signingConfigs blocks.
          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          signing_config = '''
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storeType "PKCS12"
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''

          if "android {" not in text:
              raise SystemExit(
                  "Could not find android block in build.gradle."
              )

          text = text.replace(
              "android {",
              "android {" + signing_config,
              1
          )

          # ------------------------------------------------
          # PocketRule version
          # ------------------------------------------------

          version_code = "11706"
          version_name = "1.17.6"

          if re.search(r"versionCode\s+\d+", text):
              text = re.sub(
                  r"versionCode\s+\d+",
                  f"versionCode {version_code}",
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionCode in build.gradle."
              )

          if re.search(
              r'versionName\s+["\'][^"\']+["\']',
              text
          ):
              text = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{version_name}"',
                  text,
                  count=1
              )
          else:
              raise SystemExit(
                  "Could not find versionName in build.gradle."
              )

          # ------------------------------------------------
          # Attach signing configuration to release build
          # ------------------------------------------------

          release_pattern = (
              r'(buildTypes\s*\{\s*release\s*\{)'
          )

          if not re.search(
              r'signingConfig\s+signingConfigs\.release',
              text
          ):
              if not re.search(
                  release_pattern,
                  text
              ):
                  raise SystemExit(
                      "Could not find release build type."
                  )

              text = re.sub(
                  release_pattern,
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1
              )

          path.write_text(text)

          print(
              "Android PKCS12 release signing configured."
          )
          PY

      # --------------------------------------------------
      # 17. Confirm signing configuration
      # --------------------------------------------------

      - name: Confirm signing configuration
        run: |
          set -euo pipefail

          grep -n -A12 -B2 "signingConfigs" \
            android/app/build.gradle

          echo "Signing configuration confirmed."

      # --------------------------------------------------
      # 18. Build signed production AAB
      # --------------------------------------------------

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease \
            --stacktrace

      # --------------------------------------------------
      # 19. Verify AAB
      # --------------------------------------------------

      - name: Verify AAB
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not created."
            exit 1
          fi

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Release AAB is empty."
            exit 1
          fi

          echo "PocketRule AAB successfully created:"
          ls -lh "$AAB"

      # --------------------------------------------------
      # 20. Upload production AAB
      # --------------------------------------------------

      - name: Upload PocketRule AAB
        uses: actions/upload-artifact@v4
        with:
          name: PocketRule-AAB-1.17.6-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 21. Cleanup signing material
      # --------------------------------------------------

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/upload-keystore.jks

          if [ -f android/upload-keystore.jks ]; then
            echo "ERROR: Keystore cleanup failed."
            exit 1
          fi

          echo "Temporary signing material removed."
