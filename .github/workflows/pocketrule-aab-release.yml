name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout PocketRule
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # --------------------------------------------------
      # 2. Setup Node
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Install Capacitor packages
      # --------------------------------------------------

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0

      # --------------------------------------------------
      # 5. Build PocketRule
      # --------------------------------------------------

      - name: Build PocketRule
        run: npm run build

      # --------------------------------------------------
      # 6. Add Android platform
      # --------------------------------------------------

      - name: Add Android platform
        run: npx cap add android

      # --------------------------------------------------
      # 7. Generate Android assets
      # --------------------------------------------------

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android

      # --------------------------------------------------
      # 8. Add notification permission
      # --------------------------------------------------

      - name: Add Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

              if marker not in text:
                  raise SystemExit(
                      "Could not find Android manifest root."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + permission,
                  1
              )

          manifest.write_text(text)
          PY

      # --------------------------------------------------
      # 9. Sync Capacitor
      # --------------------------------------------------

      - name: Sync Capacitor
        run: npx cap sync android

      # --------------------------------------------------
      # 10. Setup Java
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # --------------------------------------------------
      # 11. Validate signing secrets
      # --------------------------------------------------

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "Missing KEYSTORE_PASSWORD secret"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "Missing KEY_ALIAS secret"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "Missing KEY_PASSWORD secret"
            exit 1
          }

          echo "All signing secrets are present."

      # --------------------------------------------------
      # 12. Decode original PKCS12 keystore
      # --------------------------------------------------

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/upload-keystore.p12

          test -s android/upload-keystore.p12 || {
            echo "Keystore could not be decoded."
            exit 1
          }

          chmod 600 android/upload-keystore.p12

          echo "Original PKCS12 keystore decoded."

      # --------------------------------------------------
      # 13. Verify original PKCS12 keystore
      # --------------------------------------------------

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -keystore android/upload-keystore.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/original-keystore.txt

          echo "Original PKCS12 keystore verified."

      # --------------------------------------------------
      # 14. Convert PKCS12 to JKS for Gradle
      # --------------------------------------------------

      - name: Convert keystore to JKS
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Converting PKCS12 keystore to JKS..."

          rm -f android/upload-keystore.jks

          keytool \
            -importkeystore \
            -srckeystore android/upload-keystore.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore android/upload-keystore.jks \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEYSTORE_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt

          test -s android/upload-keystore.jks || {
            echo "JKS conversion failed."
            exit 1
          }

          chmod 600 android/upload-keystore.jks

          echo "PKCS12 successfully converted to JKS."

      # --------------------------------------------------
      # 15. Verify converted JKS
      # --------------------------------------------------

      - name: Verify converted JKS
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -keystore android/upload-keystore.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/jks-info.txt

          echo "Converted JKS keystore is valid."

      # --------------------------------------------------
      # 16. Configure Android release signing
      # --------------------------------------------------

      - name: Configure Android release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Remove previously injected signing configurations.
          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          signing_config = '''
              signingConfigs {
                  release {
                      storeFile file("../upload
