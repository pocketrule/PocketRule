name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. ENSURE REQUIRED CAPACITOR PACKAGES
      # ============================================================

      - name: Ensure Capacitor packages
        run: |
          set -euo pipefail

          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            @capacitor-community/admob@7.2.0 \
            lucide-react@1.32.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true
          echo "Security audit completed."


      # ============================================================
      # 6. VALIDATE ADMOB SECRETS
      # ============================================================

      - name: Validate AdMob secrets
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$ADMOB_APP_ID" ]; then
            echo "ERROR: ADMOB_APP_ID GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$ADMOB_BANNER_AD_UNIT_ID" ]; then
            echo "ERROR: ADMOB_BANNER_AD_UNIT_ID GitHub Secret is missing."
            exit 1
          fi

          if [[ "$ADMOB_APP_ID" != ca-app-pub-*~* ]]; then
            echo "ERROR: ADMOB_APP_ID format appears invalid."
            exit 1
          fi

          if [[ "$ADMOB_BANNER_AD_UNIT_ID" != ca-app-pub-*/* ]]; then
            echo "ERROR: ADMOB_BANNER_AD_UNIT_ID format appears invalid."
            exit 1
          fi

          echo "AdMob secrets verified."


      # ============================================================
      # 7. BUILD WEB APP
      # ============================================================

      - name: Build PocketRule
        env:
          VITE_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VITE_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          VITE_ADMOB_ENABLED: "true"
          VITE_ADMOB_TESTING: "true"
        run: |
          set -euo pipefail

          npm run build


      # ============================================================
      # 8. VERIFY WEB BUILD
      # ============================================================

      - name: Verify web build
        run: |
          set -euo pipefail

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "Web build verified."


      # ============================================================
      # 9. ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi


      # ============================================================
      # 10. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          set -euo pipefail

          if [ -d "assets" ]; then
            npx -y @capacitor/assets@3.0.4 generate --android
          else
            echo "No assets directory. Skipping asset generation."
          fi


      # ============================================================
      # 11. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: |
          set -euo pipefail

          npx cap sync android


      # ============================================================
      # 12. CONFIGURE ADMOB ANDROID APP ID
      # ============================================================

      - name: Configure Android AdMob App ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -euo pipefail

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          mkdir -p android/app/src/main/res/values

          if [ ! -f "$STRINGS_FILE" ]; then
            cat > "$STRINGS_FILE" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
          </resources>
          EOF
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          app_id = os.environ["ADMOB_APP_ID"]

          # --------------------------------------------------------
          # Configure AdMob App ID resource
          # --------------------------------------------------------

          text = strings.read_text()

          admob_line = (
              f'    <string name="admob_app_id">'
              f'{app_id}'
              f'</string>'
          )

          pattern = (
              r'\s*<string\s+'
              r'name=["\']admob_app_id["\']'
              r'[^>]*>.*?</string>'
          )

          if re.search(pattern, text, flags=re.DOTALL):
              text = re.sub(
                  pattern,
                  "\n" + admob_line,
                  text,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              text = text.replace(
                  "</resources>",
                  "\n" + admob_line + "\n</resources>",
                  1
              )

          strings.write_text(text)

          # --------------------------------------------------------
          # Configure AdMob application metadata
          # --------------------------------------------------------

          manifest_text = manifest.read_text()

          metadata = """        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />"""

          metadata_pattern = re.compile(
              r'\s*<meta-data\s+'
              r'android:name=["\']com\.google\.android\.gms\.ads\.APPLICATION_ID["\']'
              r'[^>]*/?>',
              re.DOTALL
          )

          if metadata_pattern.search(manifest_text):
              manifest_text = metadata_pattern.sub(
                  "\n" + metadata,
                  manifest_text,
                  count=1
              )
          else:
              application_match = re.search(
                  r'(<application\b[^>]*>)',
                  manifest_text
              )

              if not application_match:
                  raise SystemExit(
                      "ERROR: Android application element not found."
                  )

              insert_at = application_match.end()

              manifest_text = (
                  manifest_text[:insert_at]
                  + "\n"
                  + metadata
                  + manifest_text[insert_at:]
              )

          manifest.write_text(manifest_text)

          print("AdMob Android App ID configured.")
          PY


      # ============================================================
      # 13. ANDROID PERMISSIONS
      # ============================================================

      - name: Configure Android permissions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          manifest.write_text(text)

          print("Android permissions configured.")
          PY


      # ============================================================
      # 14. VERIFY ADMOB CONFIGURATION
      # ============================================================

      - name: Verify AdMob Android configuration
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -euo pipefail

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          test -f "$STRINGS_FILE"
          test -f "$MANIFEST_FILE"

          grep -Fq \
            'name="admob_app_id"' \
            "$STRINGS_FILE" || {
              echo "ERROR: AdMob App ID resource missing."
              exit 1
          }

          grep -Fq \
            'com.google.android.gms.ads.APPLICATION_ID' \
            "$MANIFEST_FILE" || {
              echo "ERROR: AdMob APPLICATION_ID metadata missing."
              exit 1
          }

          grep -Fq \
            "$ADMOB_APP_ID" \
            "$STRINGS_FILE" || {
              echo "ERROR: Configured AdMob App ID does not match the GitHub Secret."
              exit 1
          }

          echo "AdMob Android configuration verified."


      # ============================================================
      # 15. JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 16. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."


      # ============================================================
      # 17. DECODE KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          if [ ! -s android/upload-keystore-original ]; then
            echo "ERROR: Keystore decoding failed."
            exit 1
          fi

          chmod 600 android/upload-keystore-original

          echo "Keystore decoded successfully."


      # ============================================================
      # 18. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/p12.txt 2>&1
          then

            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

            echo "Keystore type: PKCS12"

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/jks.txt 2>&1
          then

            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "EFFECTIVE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

            echo "Keystore type: JKS"

          else

            echo "ERROR: Unable to identify keystore."

            cat /tmp/p12.txt || true
            cat /tmp/jks.txt || true

            exit 1
          fi


      # ============================================================
      # 19. VERIFY KEYSTORE
      # ============================================================

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/keystore-info.txt

          if ! grep -Fq "Alias name: $KEY_ALIAS" /tmp/keystore-info.txt; then
            echo "ERROR: Alias was not found."

            echo "Available aliases:"
            grep "Alias name:" /tmp/keystore-info.txt || true

            exit 1
          fi

          echo "Keystore and alias verified."


      # ============================================================
      # 20. VERIFY PRIVATE KEY
      # ============================================================

      - name: Verify private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$EFFECTIVE_KEY_PASSWORD" \
            -file /tmp/test.csr

          rm -f /tmp/test.csr

          echo "Private key verified."


      # ============================================================
      # 21. CONFIGURE VERSION + SIGNING
      # ============================================================

      - name: Configure Android release
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION_CODE = 11712
          VERSION_NAME = "1.18.0"

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          text = path.read_text()

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          code_matches = re.findall(
              r"\bversionCode\s+\d+",
              text
          )

          if not code_matches:
              raise SystemExit(
                  "ERROR: versionCode not found."
              )

          text = re.sub(
              r"\bversionCode\s+\d+",
              f"versionCode {VERSION_CODE}",
              text
          )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          name_matches = re.findall(
              r'\bversionName\s+["\'][^"\']+["\']',
              text
          )

          if not name_matches:
              raise SystemExit(
                  "ERROR: versionName not found."
              )

          text = re.sub(
              r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "{VERSION_NAME}"',
              text
          )

          # --------------------------------------------------------
          # SIGNING CONFIG
          # --------------------------------------------------------

          signing_block = """signingConfigs {
              release {
                  storeFile file("../upload-keystore-original")
                  storeType System.getenv("KEYSTORE_TYPE")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("EFFECTIVE_KEY_PASSWORD")
              }
          }"""

          signing_match = re.search(
              r"\bsigningConfigs\s*\{",
              text
          )

          if signing_match:

              start = signing_match.start()
              brace = text.find("{", start)

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "ERROR: Could not parse signingConfigs."
                  )

              text = (
                  text[:start]
                  + signing_block
                  + text[end:]
              )

          else:

              android_match = re.search(
                  r"\bandroid\s*\{",
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              position = android_match.end()

              block = (
                  "\n\n    "
                  + signing_block.replace(
                      "\n",
                      "\n    "
                  )
              )

              text = (
                  text[:position]
                  + block
                  + text[position:]
              )

          # --------------------------------------------------------
          # RELEASE SIGNING
          # --------------------------------------------------------

          release_match = re.search(
              r"(buildTypes\s*\{\s*release\s*\{)",
              text
          )

          if not release_match:
              raise SystemExit(
                  "ERROR: release build type not found."
              )

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)

          print("================================")
          print("POCKETRULE RELEASE CONFIGURED")
          print("================================")
          print("Version name: 1.18.0")
          print("Version code: 11712")
          print("Release signing: configured")
          print("================================")
          PY


      # ============================================================
      # 22. VERIFY VERSION + SIGNING
      # ============================================================

      - name: Verify Android configuration
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path(
              "android/app/build.gradle"
          ).read_text()

          codes = re.findall(
              r"\bversionCode\s+(\d+)",
              text
          )

          if len(codes) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionCode. "
                  f"Found {len(codes)}."
              )

          if codes[0] != "11712":
              raise SystemExit(
                  f"ERROR: Expected versionCode 11712. "
                  f"Found {codes[0]}."
              )

          names = re.findall(
              r'\bversionName\s+["\']([^"\']+)["\']',
              text
          )

          if len(names) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionName. "
                  f"Found {len(names)}."
              )

          if names[0] != "1.18.0":
              raise SystemExit(
                  f"ERROR: Expected versionName 1.18.0. "
                  f"Found {names[0]}."
              )

          if "signingConfig signingConfigs.release" not in text:
              raise SystemExit(
                  "ERROR: Release signing is not configured."
              )

          print("================================")
          print("ANDROID CONFIGURATION VERIFIED")
          print("================================")
          print("Version name: 1.18.0")
          print("Version code: 11712")
          print("Release signing: OK")
          print("================================")
          PY


      # ============================================================
      # 23. BUILD SIGNED AAB
      # ============================================================

      - name: Build signed release AAB
        env:
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EFFECTIVE_KEY_PASSWORD: ${{ env.EFFECTIVE_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 24. PREPARE AAB
      # ============================================================

      - name: Prepare AAB artifact
        run: |
          set -euo pipefail

          SOURCE_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          RELEASE_AAB="release/PocketRule-v1.18.0-code11712.aab"

          if [ ! -f "$SOURCE_AAB" ]; then
            echo "ERROR: AAB was not generated."
            echo ""
            echo "Available AAB files:"
            find android -type f -name "*.aab" -print || true
            exit 1
          fi

          mkdir -p release

          cp "$SOURCE_AAB" "$RELEASE_AAB"

          if [ ! -s "$RELEASE_AAB" ]; then
            echo "ERROR: Prepared AAB is empty."
            exit 1
          fi

          echo "AAB prepared successfully:"
          ls -lh "$RELEASE_AAB"


      # ============================================================
      # 25. VERIFY AAB
      # ============================================================

      - name: Verify AAB
        run: |
          set -euo pipefail

          FILE="release/PocketRule-v1.18.0-code11712.aab"

          test -f "$FILE"
          test -s "$FILE"

          SIZE=$(stat -c%s "$FILE")

          echo "================================"
          echo "AAB VERIFIED"
          echo "================================"
          echo "File: $FILE"
          echo "Size: $SIZE bytes"
          echo ""
          echo "SHA256:"
          sha256sum "$FILE"


      # ============================================================
      # 26. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        run: |
          set -euo pipefail

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/PocketRule-v1.18.0-code11712.aab

          echo "AAB signature verification passed."


      # ============================================================
      # 27. UPLOAD AAB ARTIFACT
      # ============================================================

      - name: Upload PocketRule AAB
        id: upload_aab
        uses: actions/upload-artifact@v7
        with:
          name: PocketRule-AAB-v1.18.0-code11712
          path: release/PocketRule-v1.18.0-code11712.aab
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 28. CONFIRM ARTIFACT
      # ============================================================

      - name: Confirm artifact
        env:
          ARTIFACT_URL: ${{ steps.upload_aab.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload_aab.outputs.artifact-id }}
        run: |
          set -euo pipefail

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: GitHub did not return an artifact ID."
            exit 1
          fi

          echo "================================"
          echo "POCKETRULE AAB ARTIFACT READY"
          echo "================================"
          echo "Artifact ID: $ARTIFACT_ID"
          echo "Artifact URL: $ARTIFACT_URL"
          echo "File: PocketRule-v1.18.0-code11712.aab"
          echo "Version: 1.18.0"
          echo "Version code: 11712"
          echo "AdMob: CONFIGURED"
          echo "AdMob testing: ENABLED"
          echo "================================"
