name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL CAPACITOR PACKAGES
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================

      - name: Security audit
        continue-on-error: true
        run: npm audit --audit-level=high


      # ============================================================
      # 6. BUILD POCKETRULE WEB APP
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ADD ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: npx cap add android


      # ============================================================
      # 8. GENERATE ANDROID ASSETS
      # ============================================================

      - name: Generate Android assets
        run: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --android


      # ============================================================
      # 9. ANDROID NOTIFICATION PERMISSIONS
      # ============================================================

      - name: Add Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find Android manifest root."
              )

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
          ]

          missing = [
              permission
              for permission in permissions
              if permission not in text
          ]

          if missing:
              text = text.replace(
                  marker,
                  marker + "\n    " + "\n    ".join(missing),
                  1
              )

              manifest.write_text(text)

          print(
              "Android notification and exact-alarm permissions configured."
          )
          PY


      # ============================================================
      # 10. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # 11. SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."


      # ============================================================
      # 13. DECODE ORIGINAL KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/upload-keystore-original

          test -s android/upload-keystore-original || {
            echo "ERROR: Keystore decoding failed."
            exit 1
          }

          chmod 600 android/upload-keystore-original

          echo "Original keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore type..."

          if keytool \
              -list \
              -storetype PKCS12 \
              -keystore android/upload-keystore-original \
              -storepass "$KEYSTORE_PASSWORD" \
              > /tmp/pkcs12-test.txt 2>&1; then

            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "Detected keystore type: PKCS12"

          elif keytool \
              -list \
              -storetype JKS \
              -keystore android/upload-keystore-original \
              -storepass "$KEYSTORE_PASSWORD" \
              > /tmp/jks-test.txt 2>&1; then

            echo
