name: PocketRule AAB - Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed PocketRule AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout PocketRule
        uses: actions/checkout@v6
        with:
          persist-credentials: false


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL PINNED CAPACITOR 7 PACKAGES
      # ============================================================

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.8 \
            @capacitor/android@7.6.8 \
            @capacitor/local-notifications@7.0.7 \
            @capacitor/cli@7.6.8 \
            lucide-react@0.468.0


      # ============================================================
      # 5. SECURITY AUDIT
      # ============================================================
      # Audit findings are reported but do not stop the release.
      # This is intentionally separate from the production build.

      - name: Security audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true


      # ============================================================
      # 6. BUILD WEB APPLICATION
      # ============================================================

      - name: Build PocketRule
        run: npm run build


      # ============================================================
      # 7. ADD ANDROID PLATFORM IF NEEDED
      # ============================================================

      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists."
          else
            echo "Android platform does not exist."
            echo "Creating Android platform..."
            npx cap add android
          fi


      # ============================================================
      # 8. GENERATE ANDROID ASSETS
      # ============================================================
      # The repository contains an assets directory.
      # Use the pinned Capacitor Assets release without adding it
      # permanently to package.json.

      - name: Generate Android assets
        run: |
          if [ -d "assets" ]; then
            echo "Assets directory found."
            npx -y @capacitor/assets@3.0.5 generate --android
          else
            echo "No root assets directory found."
            echo "Skipping Capacitor asset generation."
          fi


      # ============================================================
      # 9. SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ============================================================
      # 10. ADD ANDROID NOTIFICATION PERMISSIONS
      # ============================================================
      # This is deliberately AFTER cap sync so Capacitor sync cannot
      # overwrite the changes.

      - name: Configure Android notification permissions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          missing = [
              permission
              for permission in permissions
              if permission not in text
          ]

          if missing:
              marker = "</manifest>"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: Could not find closing manifest tag."
                  )

              text = text.replace(
                  marker,
                  "\n    "
                  + "\n    ".join(missing)
                  + "\n"
                  + marker,
                  1
              )

              manifest.write_text(text)

          print("Android notification permissions verified.")

          for permission in permissions:
              if permission in text:
                  print("PRESENT:", permission)
          PY


      # ============================================================
      # 11. SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 12. VALIDATE SIGNING SECRETS
      # ============================================================

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."


      # ============================================================
      # 13. DECODE ORIGINAL KEYSTORE
      # ============================================================

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p android

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/upload-keystore-original

          if [ ! -s android/upload-keystore-original ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          chmod 600 android/upload-keystore-original

          echo "Upload keystore decoded successfully."


      # ============================================================
      # 14. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect keystore type
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore type..."

          if keytool \
            -list \
            -storetype PKCS12 \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/pkcs12-test.txt 2>&1
          then
            echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "Detected: PKCS12"

          elif keytool \
            -list \
            -storetype JKS \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/jks-test.txt 2>&1
          then
            echo "KEYSTORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "Detected: JKS"

          else
            echo "ERROR: Unable to identify the keystore."

            echo ""
            echo "PKCS12 test:"
            cat /tmp/pkcs12-test.txt || true

            echo ""
            echo "JKS test:"
            cat /tmp/jks-test.txt || true

            exit 1
          fi


      # ============================================================
      # 15. VERIFY ORIGINAL KEYSTORE AND ALIAS
      # ============================================================

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Verifying upload keystore..."

          keytool \
            -list \
            -v \
            -storetype "$KEYSTORE_TYPE" \
            -keystore android/upload-keystore-original \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/keystore-info.txt

          if ! grep -Fq "Alias name: $KEY_ALIAS" /tmp/keystore-info.txt; then
            echo "ERROR: Requested alias was not found."

            echo ""
            echo "Available aliases:"
            grep "Alias name:" /tmp/keystore-info.txt || true

            exit 1
          fi

          echo "Keystore verified."
          echo "Alias verified."


      # ============================================================
      # 16. VERIFY ORIGINAL PRIVATE KEY
      # ============================================================

      - name: Verify original private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Testing private key..."

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore android/upload-keystore-original \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/private-key-test.csr

          rm -f /tmp/private-key-test.csr

          echo "Private key verified."


      # ============================================================
      # 17. CONFIGURE ANDROID RELEASE SIGNING + VERSION
      # ============================================================

      - name: Configure Android release signing and version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION_CODE = 11709
          VERSION_NAME = "1.17.9"

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle was not found."
              )

          text = path.read_text()

          # ========================================================
          # VERSION CODE
          # ========================================================

          text, code_count = re.subn(
              r"\bversionCode\s+\d+",
              f"versionCode {VERSION_CODE}",
              text
          )

          if code_count == 0:
              raise SystemExit(
                  "ERROR: No versionCode declaration was found."
              )

          # ========================================================
          # VERSION NAME
          # ========================================================

          text, name_count = re.subn(
              r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "{VERSION_NAME}"',
              text
          )

          if name_count == 0:
              raise SystemExit(
                  "ERROR: No versionName declaration was found."
              )

          # ========================================================
          # REMOVE OLD RELEASE SIGNING CONFIG IF PRESENT
          # ========================================================
          # This removes only an existing release block inside
          # signingConfigs, preventing duplicate release blocks.

          signing_configs_match = re.search(
              r"signingConfigs\s*\{",
              text
          )

          signing_block = """signingConfigs {
              release {
                  storeFile file("../upload-keystore-original")
                  storeType System.getenv("KEYSTORE_TYPE")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }"""

          if signing_configs_match:
              start = signing_configs_match.start()
              brace_start = text.find("{", start)

              depth = 0
              end = None

              for i in range(brace_start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "ERROR: Could not parse signingConfigs block."
                  )

              text = (
                  text[:start]
                  + signing_block
                  + text[end:]
              )

          else:
              android_match = re.search(
                  r"\bandroid\s*\{",
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block was not found."
                  )

              insert_at = android_match.end()

              text = (
                  text[:insert_at]
                  + "\n\n    "
                  + signing_block.replace("\n", "\n    ")
                  + "\n"
                  + text[insert_at:]
              )

          # ========================================================
          # RELEASE BUILD TYPE
          # ========================================================

          release_signing_line = (
              "signingConfig signingConfigs.release"
          )

          if release_signing_line not in text:

              release_match = re.search(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  text
              )

              if not release_match:
                  raise SystemExit(
                      "ERROR: release build type was not found."
                  )

              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)

          print("========================================")
          print("PocketRule Android release configuration")
          print("========================================")
          print("Version name :", VERSION_NAME)
          print("Version code :", VERSION_CODE)
          print("Signing      : configured")
          print("Keystore     : original upload keystore")
          print("========================================")
          PY


      # ============================================================
      # 18. VERIFY FINAL ANDROID CONFIGURATION
      # ============================================================

      - name: Verify final Android configuration
        env:
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION_CODE = 11709
          VERSION_NAME = "1.17.9"

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # --------------------------------------------------------
          # VERSION CODE
          # --------------------------------------------------------

          codes = re.findall(
              r"\bversionCode\s+(\d+)",
              text
          )

          if len(codes) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionCode. Found {len(codes)}."
              )

          if int(codes[0]) != VERSION_CODE:
              raise SystemExit(
                  f"ERROR: Expected versionCode {VERSION_CODE}, "
                  f"found {codes[0]}."
              )

          # --------------------------------------------------------
          # VERSION NAME
          # --------------------------------------------------------

          names = re.findall(
              r'\bversionName\s+["\']([^"\']+)["\']',
              text
          )

          if len(names) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one versionName. Found {len(names)}."
              )

          if names[0] != VERSION_NAME:
              raise SystemExit(
                  f"ERROR: Expected versionName {VERSION_NAME}, "
                  f"found {names[0]}."
              )

          # --------------------------------------------------------
          # SIGNING
          # --------------------------------------------------------

          required = [
              "signingConfigs",
              "release {",
              "storeFile file(\"../upload-keystore-original\")",
              "storePassword System.getenv(\"KEYSTORE_PASSWORD\")",
              "keyAlias System.getenv(\"KEY_ALIAS\")",
              "keyPassword System.getenv(\"KEY_PASSWORD\")",
              "signingConfig signingConfigs.release"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      f"ERROR: Required Android signing configuration "
                      f"is missing: {item}"
                  )

          print("Android configuration verified.")
          print(f"versionName = {VERSION_NAME}")
          print(f"versionCode = {VERSION_CODE}")
          print("release signing = configured")
          PY


      # ============================================================
      # 19. BUILD SIGNED RELEASE AAB
      # ============================================================

      - name: Build signed release AAB
        env:
          KEYSTORE_TYPE: ${{ env.KEYSTORE_TYPE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 20. LOCATE AAB
      # ============================================================

      - name: Locate release AAB
        run: |
          set -euo pipefail

          echo "Searching for release AAB..."

          find android/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print

          AAB="$(find android/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            | he
